$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
# Two levels of Include, as a shared layer between an entry and its modules would add (entry > layer > module).
# Reports each item: info
resources:
  - type: Microsoft.DSC/Include
    name: machine
    properties:
      configurationFile: machine-info.dsc.yaml
    metadata:
      description: Stand-in for an Include of a shared layer
