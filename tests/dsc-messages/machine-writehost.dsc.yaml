$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
# Laid out like dsc/winfiles.machine.dsc.yaml: three resources, the middle one an Include of the slow list
# (what just install runs, one level of Include). Reports each item: writehost
resources:
  - type: Test/SlowList
    name: PowerShell
    properties:
      items: [pwsh]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/powershell/pwsh.dsc.yaml
  - type: Microsoft.DSC/Include
    name: packages
    properties:
      configurationFile: list-writehost.dsc.yaml
    metadata:
      description: Stand-in for the Include of dsc/packages/winget.dsc.yaml
  - type: Test/SlowList
    name: Brave
    properties:
      items: [policies]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/policies/brave.dsc.yaml
