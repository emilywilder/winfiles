$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
# Laid out like dsc/iris.system.dsc.yaml: three resources, the middle one an Include of the slow list
# (what just install runs, one level of Include). Reports each item: levels
resources:
  - type: Test/SlowList
    name: PowerShell
    properties:
      items: [pwsh]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/modules/system/powershell.dsc.yaml
  - type: Microsoft.DSC/Include
    name: packages
    properties:
      configurationFile: list-levels.dsc.yaml
    metadata:
      description: Stand-in for the Include of dsc/modules/system/dev.dsc.yaml
  - type: Test/SlowList
    name: Brave
    properties:
      items: [policies]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/modules/system/policies.dsc.yaml
