$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Laid out like dsc/iris.system.dsc.yaml: three resources, the middle one an Include of the slow list
# (what winfiles.ps1 install runs, one level of Include). Reports each item: env
resources:
  - type: Test/SlowList
    name: PowerShell
    properties:
      items: [pwsh]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/modules/system/powershell.dsc.yaml
  - type: Microsoft.DSC/Include
    name: packages
    properties:
      configurationFile: list-env.dsc.yaml
    metadata:
      description: Stand-in for the Include of dsc/hosts/iris/system/packages-dev.dsc.yaml
  - type: Test/SlowList
    name: Brave
    properties:
      items: [policies]
      mode: quiet
      delay: 2
    metadata:
      description: Stand-in for dsc/modules/system/policies.dsc.yaml
