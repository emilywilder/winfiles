$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
# Two levels of Include, as a shared layer between an entry and its modules would add (entry > layer > module).
# Reports each item: warn
resources:
  - type: Microsoft.DSC/Include
    name: machine
    properties:
      configurationFile: machine-warn.dsc.yaml
    metadata:
      description: Stand-in for an Include of a shared layer
