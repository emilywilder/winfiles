$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# The list on its own, as a child dsc runs it (like dsc/hosts/iris/system/packages-dev.dsc.yaml). Reports each item:
# writehost
resources:
  - type: Test/SlowList
    name: Gaming
    properties:
      items: [Valve.Steam, GOG.Galaxy, goatcorp.XIVLauncher, Libretro.RetroArch, RankFTW.RHI]
      mode: writehost
      delay: 2
    metadata:
      description: Work through five items, two seconds each
