$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
    # Everything here, and in what it includes, needs elevation. Only winfiles reads this: DSC ignores it
    securityContext: elevated

# The system configuration of the quick test host, for test VMs (scripts/New-TestVm.ps1): every step of a clean
# install and every kind of resource, in a fraction of the time `vm` takes. It uses the same modules as `vm`, and in
# place of iris's package documents, its own hosts/vm-quick/system/packages.dsc.yaml, a few small packages that
# still take each path through Microsoft.WinGet/Package, and one firewall rule for the one resource type iris uses
# that nothing else here does. `vm` stays the full test. Pass the host: `.\install.cmd vm-quick`.
# Nothing here says what needs a restart: the features, WSL and the computer's name report it to DSC themselves
# (`_restartRequired`), and Invoke-Configuration.ps1 applies what reported one first.
# `winfiles.ps1 system vm-quick` applies it, before the home configuration, dsc/emily@vm-quick.home.dsc.yaml.
# Paths resolve from this file's folder, nested ones too, and DSC refuses `..`, so entries stay directly in dsc/
# and every configurationFile is rooted there. A document is reached at most once from here.
resources:
  # Modules
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/system/powershell.dsc.yaml
    metadata:
      description: Install PowerShell 7 and keep remoting off

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/system/settings.dsc.yaml
    metadata:
      description: Apply machine-wide Windows and winget settings

  - type: Microsoft.DSC/Include
    name: Policies
    properties:
      configurationFile: modules/system/policies.dsc.yaml
    metadata:
      description: Apply Brave and Microsoft Edge group policies

  - type: Microsoft.DSC/Include
    name: WSL
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Features')]"
    properties:
      configurationFile: modules/system/wsl.dsc.yaml
    metadata:
      description: Install WSL and block inbound connections to it except SSH from the local subnet

  - type: Microsoft.DSC/Include
    name: Computer Name
    properties:
      configurationFile: modules/system/computername.dsc.yaml
      parametersContent: |
        parameters:
          computerName: vm-quick
    metadata:
      description: Name the computer vm-quick

  # vm-quick's own choices
  - type: Microsoft.DSC/Include
    name: Features
    properties:
      configurationFile: hosts/vm-quick/system/features.dsc.yaml
    metadata:
      description: Enable Virtual Machine Platform

  - type: Microsoft.DSC/Include
    name: Packages
    properties:
      configurationFile: hosts/vm-quick/system/packages.dsc.yaml
    metadata:
      description: Install a few small machine-wide packages

  - type: Microsoft.DSC/Include
    name: Firewall
    properties:
      configurationFile: hosts/vm-quick/system/firewall.dsc.yaml
    metadata:
      description: Keep a Windows firewall rule disabled
