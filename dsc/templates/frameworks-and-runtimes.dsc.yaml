$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Every framework and runtime winfiles has listed, for making sure one is there or looking one up. No configuration
# uses this document: modules/system/runtimes.dsc.yaml, modules/system/gaming.dsc.yaml and the host documents hold
# what gets installed, and this document isn't kept in step with them. Some of these installers need an elevated
# shell.
#   winfiles.ps1 dsc config test --file dsc/templates/frameworks-and-runtimes.dsc.yaml
#   winfiles.ps1 dsc config set  --file dsc/templates/frameworks-and-runtimes.dsc.yaml
