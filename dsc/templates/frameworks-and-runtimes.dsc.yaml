$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Every framework and runtime winfiles has listed, for making sure one is there or looking one up. No configuration
# uses this document: modules/system/runtimes.dsc.yaml, modules/system/gaming.dsc.yaml and the host documents hold what
# gets installed, and this list isn't kept in step with them. Some of these installers need an elevated shell.
#   just dsc config test --file dsc/templates/frameworks-and-runtimes.dsc.yaml
#   just dsc config set  --file dsc/templates/frameworks-and-runtimes.dsc.yaml
resources:
  - type: Winfiles/WinGetPackageList
    name: Frameworks and Runtimes
    properties:
      packages:
        # Microsoft framework packages (VCLibs, WinUI)
        - Microsoft.VCLibs.14
        - Microsoft.VCLibs.Desktop.14
        - Microsoft.UI.Xaml.2.6
        - Microsoft.UI.Xaml.2.7
        - Microsoft.UI.Xaml.2.8
        # Microsoft Visual C++ redistributables
        - Microsoft.VCRedist.2005.x86
        - Microsoft.VCRedist.2005.x64
        - Microsoft.VCRedist.2008.x86
        - Microsoft.VCRedist.2008.x64
        - Microsoft.VCRedist.2010.x86
        - Microsoft.VCRedist.2010.x64
        - Microsoft.VCRedist.2012.x86
        - Microsoft.VCRedist.2012.x64
        - Microsoft.VCRedist.2013.x86
        - Microsoft.VCRedist.2013.x64
        - Microsoft.VCRedist.2015+.x86
        - Microsoft.VCRedist.2015+.x64
        # .NET runtimes and .NET Framework
        - Microsoft.DotNet.Runtime.6
        - Microsoft.DotNet.Runtime.8
        - Microsoft.DotNet.DesktopRuntime.8
        - Microsoft.DotNet.DesktopRuntime.10
        - Microsoft.DotNet.Native.Runtime
        - Microsoft.DotNet.Framework.DeveloperPack.4.6
        # Windows App SDK runtimes
        - Microsoft.WindowsAppRuntime.1.1
        - Microsoft.WindowsAppRuntime.1.2
        - Microsoft.WindowsAppRuntime.1.3
        - Microsoft.WindowsAppRuntime.1.4
        - Microsoft.WindowsAppRuntime.1.5
        - Microsoft.WindowsAppRuntime.1.6
        - Microsoft.WindowsAppRuntime.1.7
        - Microsoft.WindowsAppRuntime.1.8
        - Microsoft.WindowsAppRuntime.2
        # Runtimes that games depend on
        - Microsoft.DirectX
        - Microsoft.XNARedist
        - Microsoft.GameInput
        - Nvidia.PhysX
        - Nvidia.PhysXLegacy
        - CreativeTechnology.OpenAL
    metadata:
      description: Ensure every framework and runtime is installed
