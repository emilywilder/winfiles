$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# emily's WSL on iris: ~/.wslconfig, ~/.wslgconfig, and NixOS-WSL (https://github.com/nix-community/NixOS-WSL)
# as the default distribution. dsc/emily@iris.home.dsc.yaml includes it after modules/home/wsl.dsc.yaml (first
# run). WSL itself comes from `just system`; Winfiles.Wsl/Distribution fails with exit code 3 when it's missing.
# post-install: Everything inside NixOS (wsl.* options, /etc/wsl.conf, users, nixos-rebuild) is owned by the NixOS
# configuration, so winfiles doesn't touch it. Set the password by hand: `wsl -d NixOS -- passwd`.
parameters:
  wslConfigPath:
    type: string
    defaultValue: '%USERPROFILE%\.wslconfig'
    metadata:
      description: Global WSL 2 settings file (applies to every distribution)
  wslgConfigPath:
    type: string
    defaultValue: '%USERPROFILE%\.wslgconfig'
    metadata:
      description: WSLg settings file

resources:
  # set doesn't run `wsl --shutdown`, which would stop every distribution, so changes apply the next
  # time WSL starts.
  # DSC parses a string starting with [ as an expression (the [[ escape fails on multi-line strings in
  # 3.3.0), so each content starts with a "Managed by winfiles" comment, like the profile stubs.
  - type: Winfiles/FileContentList
    name: WSL Config File
    properties:
      files:
        - path: "[parameters('wslConfigPath')]"
          content: |
            # Managed by winfiles (dsc/users/emily@iris/wsl.dsc.yaml)
            [wsl2]
            # Amount of RAM allocated to WSL 2; uses the specified value or 50% of available RAM, whichever is
            # lower
            #memory=8GB

            # Number of virtual processors allocated to WSL 2
            # See: Windows System Information > System Summary > Processor
            # Note: should not exceed half of total RAM to avoid OOM errors during compilation
            #processors=4

            # Swap space allocated to WSL 2 (default: 25% of total RAM); set to 0 to disable
            swap=2GB

            # Automatically reclaim unused disk space in the WSL 2 virtual disk (default: false)
            #sparseVhd=true

            # Release unused memory pages back to Windows (default: true)
            #pageReporting=true

            # Mirrored networking mode: WSL 2 shares the host network interface (requires Windows 11 22H2 or later)
            # Replaces localhostforwarding, which is superseded by this option
            networkingMode=mirrored

            # Route DNS queries through the Windows host; recommended with mirrored networking (default: false)
            dnsTunneling=true

            # Enforce Windows Firewall rules on WSL 2 traffic; recommended with mirrored networking (default:
            # false)
            #firewall=true

            # Enable WSLg: support for graphical Linux applications via X11 and Wayland (default: true)
            guiApplications=true

            # Additional kernel command line parameters (default: none)
            # kernelCommandLine=


            [experimental]
            hostAddressLoopback=true
            sparseVhd=true

            [general]
    metadata:
      description: Write the WSL 2 settings file

  - type: Winfiles/FileContentList
    name: WSLg Config File
    properties:
      files:
        - path: "[parameters('wslgConfigPath')]"
          content: |
            ; Managed by winfiles (dsc/users/emily@iris/wsl.dsc.yaml)
            [system-distro-env]
            ;hi-dpi
            WESTON_RDP_HI_DPI_SCALING=true
            ;WESTON_RDP_FRACTIONAL_HI_DPI_SCALING=false
            ;100 to 500
            ;WESTON_RDP_DEBUG_DESKTOP_SCALING_FACTOR=100
    metadata:
      description: Write the WSLg settings file

  # sha256 and location are left unset: the latest release's hash changes, and WSL's default is %LOCALAPPDATA%\wsl
  - type: Winfiles.Wsl/Distribution
    name: NixOS
    # Install after the settings so the first boot already uses them
    dependsOn:
      - "[resourceId('Winfiles/FileContentList', 'WSL Config File')]"
      - "[resourceId('Winfiles/FileContentList', 'WSLg Config File')]"
    properties:
      name: NixOS
      source: https://github.com/nix-community/NixOS-WSL/releases/latest/download/nixos.wsl
      default: true
    metadata:
      description: Ensure NixOS-WSL is installed and is the default WSL distribution
