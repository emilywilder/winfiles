$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The home configuration of emily on the quick test host: the same modules as iris, then vm-quick's own small
# choices from dsc/hosts/vm-quick/home/ (its buckets and a few packages) in place of iris's, and
# Alpine in place of NixOS-WSL. New-TestVm.ps1 names the VM's administrator after the host's user. It runs
# unelevated: Scoop is meant to run without elevation, and everything here installs per user.
# `winfiles.ps1 home emily vm-quick` applies it, after the system configuration, dsc/vm-quick.system.dsc.yaml.
# Paths resolve from this file's folder, nested ones too, and DSC refuses `..`, so entries stay directly in dsc/
# and every configurationFile is rooted there. A document is reached at most once from here.
resources:
  # Modules
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/home/powershell.dsc.yaml
    metadata:
      description: Set the module path, junctions, modules and profile redirection

  - type: Microsoft.DSC/Include
    name: Scoop
    # Installs Scoop itself (Winfiles.Scoop/Scoop), which is why the home configuration runs unelevated
    properties:
      configurationFile: modules/home/scoop.dsc.yaml
    metadata:
      description: Install Scoop and the apps it needs

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/home/settings.dsc.yaml
    metadata:
      description: Set per-user Windows settings

  - type: Microsoft.DSC/Include
    name: WSL
    # WSL itself comes from `winfiles.ps1 system`, run before this document
    properties:
      configurationFile: modules/home/wsl.dsc.yaml
    metadata:
      description: Mark WSL's first run as done

  # vm-quick's per-user choices
  - type: Microsoft.DSC/Include
    name: Scoop Buckets
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop')]"
    properties:
      configurationFile: hosts/vm-quick/home/scoop-buckets.dsc.yaml
    metadata:
      description: Add Scoop's buckets

  - type: Microsoft.DSC/Include
    name: Packages
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Buckets')]"
    properties:
      configurationFile: hosts/vm-quick/home/packages.dsc.yaml
    metadata:
      description: Install a few small per-user packages

  # emily's own choices on vm-quick
  # Alpine's minirootfs (about 4 MB) in place of NixOS-WSL (hundreds of MB). Winfiles.Wsl/Distribution downloads,
  # installs and makes it the default the same way. A versioned URL, so the image doesn't change under a test.
  # Alpine 3.24.4 was the latest stable release on 2026-11-15; bump it when Alpine drops it from the CDN.
  # Trade-off: NixOS-WSL's own image isn't installed, so `winfiles.ps1 install vm` still has to cover it.
  - type: Winfiles.Wsl/Distribution
    name: Alpine
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
    properties:
      name: Alpine
      source: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.4-x86_64.tar.gz
      default: true
    metadata:
      description: Ensure Alpine is installed and is the default WSL distribution
