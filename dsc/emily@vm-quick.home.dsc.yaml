$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The home configuration of emily on the quick test host: the shared modules that configure rather than install, a
# few small packages from hosts/vm-quick/home.dsc.yaml in place of the package lists, and Alpine in place of
# NixOS-WSL. New-TestVm.ps1 names the VM's administrator after the host's user. It runs unelevated: Scoop is meant
# to run without elevation, and everything here installs per user.
# `just home emily vm-quick` applies it, after the system configuration, dsc/vm-quick.system.dsc.yaml.
# Paths resolve from this file's folder, and DSC refuses `..`, so entries like this one stay directly in dsc/.
# Modules don't include each other, so ordering between them lives here.
resources:
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/home/powershell.dsc.yaml
    metadata:
      description: Set the module path, junctions, modules and profile redirection

  - type: Microsoft.DSC/Include
    name: Scoop Core
    # Installs Scoop itself too (Winfiles.Scoop/Scoop), which is why this has to run unelevated. Every bucket is added,
    # as on a real host, so a wrong bucket URL fails here too
    properties:
      configurationFile: modules/home/scoop-core.dsc.yaml
    metadata:
      description: Install Scoop, the apps it needs and its buckets

  - type: Microsoft.DSC/Include
    name: Packages
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/vm-quick/home.dsc.yaml
    metadata:
      description: Install a few small per-user packages

  - type: Microsoft.DSC/Include
    name: WSL
    # WSL itself comes from `just system`, run before this document
    properties:
      configurationFile: modules/home/wsl.dsc.yaml
    metadata:
      description: Mark WSL's first run as done

  # Alpine in place of NixOS-WSL, to keep the run short (see the document)
  - type: Microsoft.DSC/Include
    name: WSL User
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
    properties:
      configurationFile: users/emily@vm-quick/wsl.dsc.yaml
    metadata:
      description: Install Alpine and make it the default distribution

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/home/settings.dsc.yaml
    metadata:
      description: Set per-user Windows settings
