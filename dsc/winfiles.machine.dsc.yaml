$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The half of winfiles.dsc.yaml that needs an elevated shell for `set`: Brave policies write under HKLM,
# and machine-wide winget installers would otherwise raise a UAC prompt per package. `just install` runs
# it elevated before winfiles.user.dsc.yaml. Relative paths resolve from the top-level document's folder,
# which is dsc/ whether this runs on its own or through winfiles.dsc.yaml.
resources:
  - type: Microsoft.DSC/Include
    name: PowerShell
    # Mixes a machine install (PowerShell) with per-user setup (module path, modules,
    # profile stubs). It's here because Packages needs the Microsoft.WinGet.Client module it installs
    properties:
      configurationFile: powershell/pwsh.dsc.yaml
    metadata:
      description: Install PowerShell 7, its modules and profile redirection

  - type: Microsoft.DSC/Include
    name: Packages
    # Winfiles/WinGetPackageList needs Microsoft.WinGet.Client, from pwsh.dsc.yaml
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'PowerShell')]"
    properties:
      configurationFile: packages/winget.dsc.yaml
    metadata:
      description: Install winget packages, grouped by purpose under dsc/packages/

  - type: Microsoft.DSC/Include
    name: Brave Policies
    properties:
      configurationFile: policies/brave.dsc.yaml
    metadata:
      description: Apply Brave browser group policies
