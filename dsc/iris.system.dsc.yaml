$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    # Everything here, and in what it includes, needs elevation. Only winfiles reads this: DSC ignores it
    securityContext: elevated

# The system configuration of the iris host, like nixfiles' hosts/<host>/default.nix: the modules iris uses from
# dsc/modules/system/, with iris's values passed in parametersContent, then iris's own choices from
# dsc/hosts/iris/system/: its features, its packages and its hardware's software. What `set` needs an elevated
# shell for: browser policies and system settings write under HKLM, the WSL firewall changes Hyper-V firewall
# settings, and machine-wide winget installers would otherwise raise a UAC prompt per package.
# Nothing here says what needs a restart: the features, WSL and the computer's name report it to DSC themselves
# (`_restartRequired`), and Invoke-Configuration.ps1 applies what reported one first.
# `winfiles.ps1 system iris` applies it, before the home configuration, dsc/emily@iris.home.dsc.yaml.
# Paths resolve from this file's folder, nested ones too, and DSC refuses `..`, so entries stay directly in dsc/
# and every configurationFile is rooted there. A document is reached at most once from here.
resources:
  # Modules
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/system/powershell.dsc.yaml
    metadata:
      description: Install PowerShell 7 and keep remoting off

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/system/settings.dsc.yaml
    metadata:
      description: Apply machine-wide Windows and winget settings

  - type: Microsoft.DSC/Include
    name: Policies
    properties:
      configurationFile: modules/system/policies.dsc.yaml
    metadata:
      description: Apply Brave and Microsoft Edge group policies

  - type: Microsoft.DSC/Include
    name: Remote Desktop
    properties:
      configurationFile: modules/system/remote-desktop.dsc.yaml
    metadata:
      description: Allow Remote Desktop from Private networks

  - type: Microsoft.DSC/Include
    name: WSL
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Features')]"
    properties:
      configurationFile: modules/system/wsl.dsc.yaml
    metadata:
      description: Install WSL and block inbound connections to it except SSH from the local subnet

  - type: Microsoft.DSC/Include
    name: Computer Name
    properties:
      configurationFile: modules/system/computername.dsc.yaml
      parametersContent: |
        parameters:
          computerName: iris
    metadata:
      description: Name the computer iris

  # iris's own choices
  - type: Microsoft.DSC/Include
    name: Features
    properties:
      configurationFile: hosts/iris/system/features.dsc.yaml
    metadata:
      description: Enable Virtual Machine Platform and Hyper-V

  - type: Microsoft.DSC/Include
    name: Runtimes
    properties:
      configurationFile: hosts/iris/system/packages-runtimes.dsc.yaml
    metadata:
      description: Install frameworks and runtimes that apps depend on

  - type: Microsoft.DSC/Include
    name: Base
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-base.dsc.yaml
    metadata:
      description: Install machine-wide system tools

  - type: Microsoft.DSC/Include
    name: Dev
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-dev.dsc.yaml
    metadata:
      description: Install machine-wide development tools

  - type: Microsoft.DSC/Include
    name: Gaming
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-gaming.dsc.yaml
    metadata:
      description: Install game launchers and game runtimes

  - type: Microsoft.DSC/Include
    name: Internet
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-internet.dsc.yaml
    metadata:
      description: Install machine-wide browsers, mail and networking tools

  - type: Microsoft.DSC/Include
    name: Productivity
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-productivity.dsc.yaml
    metadata:
      description: Install the office suite and LaTeX editor

  - type: Microsoft.DSC/Include
    name: Media
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/packages-media.dsc.yaml
    metadata:
      description: Install machine-wide media players and tools

  - type: Microsoft.DSC/Include
    name: Hardware
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/system/hardware.dsc.yaml
    metadata:
      description: Install machine-wide software for iris's hardware
