$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The system configuration of the iris host, like nixosConfigurations.iris: what `set` needs an elevated
# shell for. Browser policies and system settings write under HKLM, the WSL firewall changes Hyper-V
# firewall settings, and machine-wide winget installers would otherwise raise a UAC prompt per package.
# `just system iris` applies it, before the home configuration, dsc/emily@iris.home.dsc.yaml.
# Paths resolve from this file's folder, and DSC refuses `..`, so entries like this one stay directly in dsc/.
# Modules don't include each other, so ordering between them lives here.
resources:
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/system/powershell.dsc.yaml
    metadata:
      description: Install PowerShell 7 and the module winget lists need

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/system/settings.dsc.yaml
    metadata:
      description: Apply machine-wide Windows and winget settings

  - type: Microsoft.DSC/Include
    name: Policies
    properties:
      configurationFile: modules/system/policies.dsc.yaml
    metadata:
      description: Apply Brave and Microsoft Edge group policies

  - type: Microsoft.DSC/Include
    name: Runtimes
    # Winfiles/WinGetPackageList needs Microsoft.WinGet.Client, from modules/system/powershell.dsc.yaml
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'PowerShell')]"
    properties:
      configurationFile: modules/system/runtimes.dsc.yaml
    metadata:
      description: Install frameworks and runtimes that apps depend on

  - type: Microsoft.DSC/Include
    name: Base
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/base.dsc.yaml
    metadata:
      description: Install machine-wide system tools

  - type: Microsoft.DSC/Include
    name: Dev
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/dev.dsc.yaml
    metadata:
      description: Install machine-wide development tools

  - type: Microsoft.DSC/Include
    name: Gaming
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/gaming.dsc.yaml
    metadata:
      description: Install game launchers and game runtimes

  - type: Microsoft.DSC/Include
    name: Internet
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/internet.dsc.yaml
    metadata:
      description: Install machine-wide browsers, mail and networking tools

  - type: Microsoft.DSC/Include
    name: Productivity
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/productivity.dsc.yaml
    metadata:
      description: Install the office suite and LaTeX editor

  - type: Microsoft.DSC/Include
    name: Media
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: modules/system/media.dsc.yaml
    metadata:
      description: Install machine-wide media players and tools

  - type: Microsoft.DSC/Include
    name: WSL Firewall
    # The rest of WSL is in the home configuration; Hyper-V firewall settings need elevation to set
    properties:
      configurationFile: modules/system/wsl.dsc.yaml
    metadata:
      description: Block inbound connections to WSL except SSH from the local subnet

  - type: Microsoft.DSC/Include
    name: Hardware
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Runtimes')]"
    properties:
      configurationFile: hosts/iris/hardware.dsc.yaml
    metadata:
      description: Install machine-wide software for iris's hardware
