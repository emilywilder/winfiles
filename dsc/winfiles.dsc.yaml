$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Composes the config documents under dsc/. Relative paths resolve from this file's folder, and
# nested Includes resolve from here too, not from the including file.
# dsc/templates/ is reference material and is deliberately not included.
# Brave policies write under HKLM, so `set` needs an elevated shell.
resources:
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: powershell/pwsh.dsc.yaml
    metadata:
      description: Install PowerShell 7, its modules and profile redirection

  - type: Microsoft.DSC/Include
    name: Packages
    # Winfiles/WinGetPackageList needs pwsh and Microsoft.WinGet.Client, both from pwsh.dsc.yaml
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'PowerShell')]"
    properties:
      configurationFile: packages/winget.dsc.yaml
    metadata:
      description: Install winget packages, grouped by purpose under dsc/packages/

  - type: Microsoft.DSC/Include
    name: Scoop Packages
    # Installing Scoop and Winfiles/ScoopPackageList both need pwsh from pwsh.dsc.yaml
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'PowerShell')]"
    properties:
      configurationFile: packages/scoop.dsc.yaml
    metadata:
      description: Install Scoop buckets and apps, grouped by purpose under dsc/packages/

  - type: Microsoft.DSC/Include
    name: WSL
    # WSL itself comes from `just wsl-install`, run before this composition. The dependency on
    # Packages is for pwsh, which Winfiles/WslDistribution runs under
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Packages')]"
    properties:
      configurationFile: wsl/wsl.dsc.yaml
    metadata:
      description: Install NixOS-WSL and make it the default distribution

  - type: Microsoft.DSC/Include
    name: Brave Policies
    properties:
      configurationFile: policies/brave.dsc.yaml
    metadata:
      description: Apply Brave browser group policies
