$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The whole winfiles state, split by the privileges `set` needs. `just install` applies the halves
# separately: winfiles.machine.dsc.yaml elevated, then winfiles.user.dsc.yaml unelevated. Running this
# document is for `test` and `get`; a `set` of it would need an elevated shell and would install the
# Scoop apps and the WSL distribution elevated too.
# Relative paths resolve from this file's folder, and nested Includes resolve from here too, not from
# the including file. Nesting the halves costs no measurable time (whole-composition test about 35s
# nested or flat, measured 2026-10-28).
# dsc/templates/ is reference material and is deliberately not included.
resources:
  - type: Microsoft.DSC/Include
    name: Machine
    properties:
      configurationFile: winfiles.machine.dsc.yaml
    metadata:
      description: PowerShell, winget packages and Brave policies (set needs an elevated shell)

  - type: Microsoft.DSC/Include
    name: User
    properties:
      configurationFile: winfiles.user.dsc.yaml
    metadata:
      description: Scoop packages and WSL (set runs unelevated)
