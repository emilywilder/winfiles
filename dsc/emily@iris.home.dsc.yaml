$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The home configuration of emily on iris, like nixfiles' hosts/<host>/home.nix: the modules iris uses from
# dsc/modules/home/, iris's per-user choices from dsc/hosts/iris/home/ (packages and its hardware's software),
# then emily's own choices on iris, written here: ~/.wslconfig,
# ~/.wslgconfig, and NixOS-WSL (https://github.com/nix-community/NixOS-WSL) as the default distribution.
# It runs unelevated: Scoop is meant to run without elevation, and everything here installs per user.
# `winfiles.ps1 home emily iris` applies it, after the system configuration, dsc/iris.system.dsc.yaml, which
# installs WSL (dsc/modules/system/wsl.dsc.yaml); Winfiles.Wsl/Distribution fails with exit code 3 when it's
# missing. The pwsh its resources run under comes from mise.toml before DSC starts.
# Paths resolve from this file's folder, nested ones too, and DSC refuses `..`, so entries stay directly in dsc/
# and every configurationFile is rooted there. A document is reached at most once from here.
# post-install: Everything inside NixOS (wsl.* options, /etc/wsl.conf, users, nixos-rebuild) is
# owned by the NixOS configuration, so winfiles doesn't touch it. Set the password by hand:
# `wsl -d NixOS -- passwd`.
parameters:
  wslConfigPath:
    type: string
    defaultValue: '%USERPROFILE%\.wslconfig'
    metadata:
      description: Global WSL 2 settings file (applies to every distribution)
  wslgConfigPath:
    type: string
    defaultValue: '%USERPROFILE%\.wslgconfig'
    metadata:
      description: WSLg settings file

resources:
  # Modules
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/home/powershell.dsc.yaml
    metadata:
      description: Set the module path, junctions, modules and profile redirection

  - type: Microsoft.DSC/Include
    name: Scoop Core
    # Installs Scoop itself too (Winfiles.Scoop/Scoop), which is why this has to run unelevated
    properties:
      configurationFile: modules/home/scoop-core.dsc.yaml
    metadata:
      description: Install Scoop, the apps it needs and its buckets

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/home/settings.dsc.yaml
    metadata:
      description: Set per-user Windows settings

  - type: Microsoft.DSC/Include
    name: WSL
    # WSL itself comes from `winfiles.ps1 system`, run before this document
    properties:
      configurationFile: modules/home/wsl.dsc.yaml
    metadata:
      description: Mark WSL's first run as done

  # iris's per-user choices
  - type: Microsoft.DSC/Include
    name: Base
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/iris/home/packages-base.dsc.yaml
    metadata:
      description: Install per-user tools, shell tools and fonts

  - type: Microsoft.DSC/Include
    name: Dev
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/iris/home/packages-dev.dsc.yaml
    metadata:
      description: Install per-user development tools

  - type: Microsoft.DSC/Include
    name: Gaming
    properties:
      configurationFile: hosts/iris/home/packages-gaming.dsc.yaml
    metadata:
      description: Install per-user game launchers

  - type: Microsoft.DSC/Include
    name: Internet
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/iris/home/packages-internet.dsc.yaml
    metadata:
      description: Install per-user browsers, communication clients and network tools

  - type: Microsoft.DSC/Include
    name: Productivity
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/iris/home/packages-productivity.dsc.yaml
    metadata:
      description: Install per-user document and notes tools

  - type: Microsoft.DSC/Include
    name: Media
    properties:
      configurationFile: hosts/iris/home/packages-media.dsc.yaml
    metadata:
      description: Install per-user creative tools

  - type: Microsoft.DSC/Include
    name: Hardware
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Core')]"
    properties:
      configurationFile: hosts/iris/home/hardware.dsc.yaml
    metadata:
      description: Install per-user software for iris's hardware

  # emily's own choices on iris

  # set doesn't run `wsl --shutdown`, which would stop every distribution, so changes apply the next
  # time WSL starts.
  # DSC parses a string starting with [ as an expression (the [[ escape fails on multi-line strings in
  # 3.3.0), so each content starts with a "Managed by winfiles" comment, like the profile stubs.
  - type: Winfiles/FileContentList
    name: WSL Config File
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
    properties:
      files:
        - path: "[parameters('wslConfigPath')]"
          content: |
            # Managed by winfiles (dsc/emily@iris.home.dsc.yaml)
            [wsl2]
            # Amount of RAM allocated to WSL 2; uses the specified value or 50% of available RAM, whichever is
            # lower
            #memory=8GB

            # Number of virtual processors allocated to WSL 2
            # See: Windows System Information > System Summary > Processor
            # Note: should not exceed half of total RAM to avoid OOM errors during compilation
            #processors=4

            # Swap space allocated to WSL 2 (default: 25% of total RAM); set to 0 to disable
            swap=2GB

            # Automatically reclaim unused disk space in the WSL 2 virtual disk (default: false)
            #sparseVhd=true

            # Release unused memory pages back to Windows (default: true)
            #pageReporting=true

            # Mirrored networking mode: WSL 2 shares the host network interface (requires Windows 11 22H2 or later)
            # Replaces localhostforwarding, which is superseded by this option
            networkingMode=mirrored

            # Route DNS queries through the Windows host; recommended with mirrored networking (default: false)
            dnsTunneling=true

            # Enforce Windows Firewall rules on WSL 2 traffic; recommended with mirrored networking (default:
            # false)
            #firewall=true

            # Enable WSLg: support for graphical Linux applications via X11 and Wayland (default: true)
            guiApplications=true

            # Additional kernel command line parameters (default: none)
            # kernelCommandLine=


            [experimental]
            hostAddressLoopback=true
            sparseVhd=true

            [general]
    metadata:
      description: Write the WSL 2 settings file

  - type: Winfiles/FileContentList
    name: WSLg Config File
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
    properties:
      files:
        - path: "[parameters('wslgConfigPath')]"
          content: |
            ; Managed by winfiles (dsc/emily@iris.home.dsc.yaml)
            [system-distro-env]
            ;hi-dpi
            WESTON_RDP_HI_DPI_SCALING=true
            ;WESTON_RDP_FRACTIONAL_HI_DPI_SCALING=false
            ;100 to 500
            ;WESTON_RDP_DEBUG_DESKTOP_SCALING_FACTOR=100
    metadata:
      description: Write the WSLg settings file

  # sha256 and location are left unset: the latest release's hash changes, and WSL's default is %LOCALAPPDATA%\wsl
  - type: Winfiles.Wsl/Distribution
    name: NixOS
    # Install after the settings so the first boot already uses them
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
      - "[resourceId('Winfiles/FileContentList', 'WSL Config File')]"
      - "[resourceId('Winfiles/FileContentList', 'WSLg Config File')]"
    properties:
      name: NixOS
      source: https://github.com/nix-community/NixOS-WSL/releases/latest/download/nixos.wsl
      default: true
    metadata:
      description: Ensure NixOS-WSL is installed and is the default WSL distribution

