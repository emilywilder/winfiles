$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Microsoft Edge group policies (see edge://policy). Writing under HKLM needs an elevated shell.
parameters:
  keyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
    metadata:
      description: Registry key Edge reads its machine policies from

resources:
  # No metadata.description: DSC passes it to the resource as _metadata, which RegistryList counts as
  # a difference, so test would always report false
  - type: Microsoft.Windows/RegistryList
    name: Edge Policies
    properties:
      registryEntries:
        # Skip Edge's first-run experience
        - keyPath: "[parameters('keyPath')]"
          valueName: HideFirstRunExperience
          valueData:
            DWord: 1
        # Open new tabs to a blank page. Edge may ignore this on a machine that isn't domain-joined or
        # enrolled in device management; edge://policy shows whether it was applied
        - keyPath: "[parameters('keyPath')]"
          valueName: NewTabPageLocation
          valueData:
            String: about:blank
