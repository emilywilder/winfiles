$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The home configuration of emily on a test VM: the modules iris uses, iris's per-user choices (its documents in
# dsc/hosts/iris/home/) but none of its hardware, and NixOS-WSL (https://github.com/nix-community/NixOS-WSL) as the
# default distribution, the one `winfiles.ps1 switch vm` covers that vm-quick's Alpine doesn't. No ~/.wslconfig or
# ~/.wslgconfig: those are emily's on iris only (dsc/emily@iris.home.dsc.yaml).
# New-TestVm.ps1 names the VM's administrator after the host's user. It runs unelevated: Scoop is meant to run
# without elevation, and everything here installs per user.
# `winfiles.ps1 home emily vm` applies it, after the system configuration, dsc/vm.system.dsc.yaml.
# The pwsh its resources run under comes from mise.toml before DSC starts.
# Paths resolve from this file's folder, nested ones too, and DSC refuses `..`, so entries stay directly in dsc/
# and every configurationFile is rooted there. A document is reached at most once from here.
resources:
  # Modules
  - type: Microsoft.DSC/Include
    name: PowerShell
    properties:
      configurationFile: modules/home/powershell.dsc.yaml
    metadata:
      description: Set the module path, junctions and profile redirection, and trust PSGallery

  - type: Microsoft.DSC/Include
    name: Scoop
    # Installs Scoop itself (Winfiles.Scoop/Scoop), which is why the home configuration runs unelevated
    properties:
      configurationFile: modules/home/scoop.dsc.yaml
    metadata:
      description: Install Scoop and the apps it needs

  - type: Microsoft.DSC/Include
    name: Settings
    properties:
      configurationFile: modules/home/settings.dsc.yaml
    metadata:
      description: Set per-user Windows settings

  - type: Microsoft.DSC/Include
    name: WSL
    # WSL itself comes from `winfiles.ps1 system`, run before this document
    properties:
      configurationFile: modules/home/wsl.dsc.yaml
    metadata:
      description: Mark WSL's first run as done

  # iris's per-user choices, so a VM run installs what iris does
  - type: Microsoft.DSC/Include
    name: PowerShell Modules
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'PowerShell')]"
    properties:
      configurationFile: hosts/iris/home/powershell-modules.dsc.yaml
    metadata:
      description: Install PowerShell modules

  - type: Microsoft.DSC/Include
    name: Scoop Buckets
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop')]"
    properties:
      configurationFile: hosts/iris/home/scoop-buckets.dsc.yaml
    metadata:
      description: Add Scoop's buckets

  - type: Microsoft.DSC/Include
    name: Base
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Buckets')]"
    properties:
      configurationFile: hosts/iris/home/packages-base.dsc.yaml
    metadata:
      description: Install per-user tools, shell tools and fonts

  - type: Microsoft.DSC/Include
    name: Dev
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Buckets')]"
    properties:
      configurationFile: hosts/iris/home/packages-dev.dsc.yaml
    metadata:
      description: Install per-user development tools

  - type: Microsoft.DSC/Include
    name: Gaming
    properties:
      configurationFile: hosts/iris/home/packages-gaming.dsc.yaml
    metadata:
      description: Install per-user game launchers

  - type: Microsoft.DSC/Include
    name: Internet
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Buckets')]"
    properties:
      configurationFile: hosts/iris/home/packages-internet.dsc.yaml
    metadata:
      description: Install per-user browsers, communication clients and network tools

  - type: Microsoft.DSC/Include
    name: Productivity
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Scoop Buckets')]"
    properties:
      configurationFile: hosts/iris/home/packages-productivity.dsc.yaml
    metadata:
      description: Install per-user document and notes tools

  - type: Microsoft.DSC/Include
    name: Media
    properties:
      configurationFile: hosts/iris/home/packages-media.dsc.yaml
    metadata:
      description: Install per-user creative tools

  # emily's own choices on vm
  # sha256 and location are left unset: the latest release's hash changes, and WSL's default is %LOCALAPPDATA%\wsl
  - type: Winfiles.Wsl/Distribution
    name: NixOS
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'WSL')]"
    properties:
      name: NixOS
      source: https://github.com/nix-community/NixOS-WSL/releases/latest/download/nixos.wsl
      default: true
    metadata:
      description: Ensure NixOS-WSL is installed and is the default WSL distribution
