$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user development tools. Machine-wide ones are in modules/system/dev.dsc.yaml.
# Left out: JetBrains.IntelliJIDEA, installed and updated through JetBrains Toolbox, and DSC, from mise.toml.
# WSL comes from `just wsl-install`, which also enables Virtual Machine Platform.
resources:
  # Editors and IDEs
  - type: Winfiles.WinGet/Package
    name: Microsoft.VisualStudioCode
    properties:
      id: Microsoft.VisualStudioCode
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Visual Studio Code

  - type: Winfiles.WinGet/Package
    name: JetBrains.Toolbox
    properties:
      id: JetBrains.Toolbox
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install JetBrains Toolbox

  - type: Winfiles.WinGet/Package
    name: JetBrains.Air.Preview
    properties:
      id: JetBrains.Air.Preview
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install JetBrains Air (preview)

  - type: Winfiles.WinGet/Package
    name: Posit.RStudio
    properties:
      id: Posit.RStudio
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install RStudio

  # Kubernetes
  - type: Winfiles.WinGet/Package
    name: Kubernetes.kubectl
    properties:
      id: Kubernetes.kubectl
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install kubectl

  # Development tools
  - type: Winfiles.WinGet/Package
    name: GitHub.GitHubDesktop
    properties:
      id: GitHub.GitHubDesktop
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install GitHub Desktop

  - type: Winfiles.WinGet/Package
    name: GitHub.cli
    properties:
      id: GitHub.cli
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the GitHub CLI

  - type: Winfiles.WinGet/Package
    name: Microsoft.NuGet
    properties:
      id: Microsoft.NuGet
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install NuGet

  - type: Winfiles.WinGet/Package
    name: Microsoft.WinDbg
    properties:
      id: Microsoft.WinDbg
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install WinDbg

  # Shell prompt
  - type: Winfiles.WinGet/Package
    name: JanDeDobbeleer.OhMyPosh
    properties:
      id: JanDeDobbeleer.OhMyPosh
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Oh My Posh

  # AI assistants and local model runners
  - type: Winfiles.WinGet/Package
    name: Anthropic.Claude
    properties:
      id: Anthropic.Claude
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Claude

  - type: Winfiles.WinGet/Package
    name: Anthropic.ClaudeCode
    properties:
      id: Anthropic.ClaudeCode
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Claude Code

  - type: Winfiles.WinGet/Package
    name: GitHub.Copilot
    properties:
      id: GitHub.Copilot
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the GitHub Copilot CLI

  - type: Winfiles.WinGet/Package
    name: Ollama.Ollama
    properties:
      id: Ollama.Ollama
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Ollama

  - type: Winfiles.WinGet/Package
    name: ElementLabs.LMStudio
    properties:
      id: ElementLabs.LMStudio
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install LM Studio

  - type: Winfiles/ScoopPackageList
    name: Dev Scoop Apps
    properties:
      packages:
        # Languages and their package managers
        - nodejs
        - python
        - uv
        # Task runner and linters
        - just
        - shellcheck
        # JSON, YAML and XML
        - jq
        - yq
        - dyff
        - xmlstarlet
        # Diff and hex editors
        - meld
        - imhex
    metadata:
      description: Ensure languages and command-line development tools are installed
