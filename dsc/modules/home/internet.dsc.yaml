$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user browsers, communication clients and network tools. Machine-wide ones are in
# modules/system/internet.dsc.yaml.
resources:
  # Web browsers (Brave's policies are in modules/system/policies.dsc.yaml)
  - type: Winfiles.WinGet/Package
    name: Brave.Brave
    properties:
      id: Brave.Brave
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Brave

  - type: Winfiles.WinGet/Package
    name: eloston.ungoogled-chromium
    properties:
      id: eloston.ungoogled-chromium
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install ungoogled-chromium

  # Mail and chat
  - type: Winfiles.WinGet/Package
    name: Microsoft.Outlook
    properties:
      id: Microsoft.Outlook
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Outlook

  - type: Winfiles.WinGet/Package
    name: Element.Element
    properties:
      id: Element.Element
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Element

  # Cloud storage and remote access
  - type: Winfiles.WinGet/Package
    name: Proton.ProtonDrive
    properties:
      id: Proton.ProtonDrive
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Proton Drive

  - type: Winfiles.WinGet/Package
    name: Microsoft.WindowsApp
    properties:
      id: Microsoft.WindowsApp
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Windows App

  # Chat (from Scoop rather than winget: winget's installer starts Discord, which asks for UAC mid-run)
  - type: Winfiles.Scoop/Package
    name: discord
    properties:
      name: discord
      bucket: extras
    metadata:
      description: Install Discord
