$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Per-user PowerShell setup: the module path, the junctions behind CurrentUser installs, PSGallery trusted, and
# the profile stubs. Which modules a host installs is its own choice, in
# dsc/hosts/<host>/home/powershell-modules.dsc.yaml, which an entry includes after this. It needs no elevation, and
# it doesn't need the winget PowerShell from dsc/modules/system/powershell.dsc.yaml: its scripts run under mise's
# pwsh, and it only writes files.
parameters:
  modulePath:
    type: string
    defaultValue: '%USERPROFILE%/.local/share/powershell/Modules'
    metadata:
      description: User module path for PowerShell 7 (environment variables are expanded at runtime)
  scriptPath:
    type: string
    defaultValue: '%USERPROFILE%/.local/share/powershell/Scripts'
    metadata:
      description: User script path for PowerShell 7 (environment variables are expanded at runtime)

resources:
  # With the junctions below, the default Documents\PowerShell\Modules already reaches modulePath, so
  # this is a trade-off, not a requirement. Documents is redirected to OneDrive here, and this keeps
  # module loading off the junction inside it; only installs go through it. The cost is that a
  # missing junction makes CurrentUser installs land outside PSModulePath. Revisit if Documents
  # stops being redirected to OneDrive.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: PowerShell Module Path
    properties:
      input: "[parameters('modulePath')]"
      getScript: |
        param($ModulePath)
        $documents = [Environment]::GetFolderPath('MyDocuments')
        $configFile = Join-Path -Path $documents -ChildPath 'PowerShell\powershell.config.json'
        if (Test-Path -Path $configFile) {
            (Get-Content -Path $configFile -Raw | ConvertFrom-Json).PSModulePath
        }
      testScript: |
        param($ModulePath)
        $documents = [Environment]::GetFolderPath('MyDocuments')
        $configFile = Join-Path -Path $documents -ChildPath 'PowerShell\powershell.config.json'
        $config = if (Test-Path -Path $configFile) { Get-Content -Path $configFile -Raw | ConvertFrom-Json }
        ($config.PSModulePath -eq $ModulePath) -and
            (Test-Path -Path ([Environment]::ExpandEnvironmentVariables($ModulePath)))
      setScript: |
        param($ModulePath)
        $documents = [Environment]::GetFolderPath('MyDocuments')
        $configFile = Join-Path -Path $documents -ChildPath 'PowerShell\powershell.config.json'
        $config = if (Test-Path -Path $configFile) {
            Get-Content -Path $configFile -Raw | ConvertFrom-Json -AsHashtable
        } else {
            @{}
        }
        $config['PSModulePath'] = $ModulePath
        New-Item -ItemType Directory -Force -Path (Split-Path -Path $configFile) | Out-Null
        # ConvertTo-Json's default depth of 2 would flatten nested settings such as PowerShellPolicies
        ConvertTo-Json -InputObject $config -Depth 10 | Set-Content -Path $configFile
        $modules = [Environment]::ExpandEnvironmentVariables($ModulePath)
        New-Item -ItemType Directory -Force -Path $modules | Out-Null
    metadata:
      description: Set a custom user module path for PowerShell 7

  # Install-Module/Install-Script/Install-PSResource -Scope CurrentUser always install to
  # Documents\PowerShell\{Modules,Scripts} (ignoring PSModulePath), so those folders are replaced
  # with junctions to modulePath/scriptPath. Existing contents are moved over first: each item is
  # moved whole unless the target already has it, in which case its children are moved one by one
  # (e.g. a module's versions, or InstalledScriptInfos entries). Anything that clashes is kept in a
  # <folder>.<timestamp>.bak folder.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Junction Default Install Folders
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript', 'PowerShell Module Path')]"
    properties:
      input:
        - folder: Modules
          target: "[parameters('modulePath')]"
        - folder: Scripts
          target: "[parameters('scriptPath')]"
      getScript: |
        param($Junctions)
        $documents = [Environment]::GetFolderPath('MyDocuments')
        foreach ($junction in $Junctions) {
            $link = Join-Path -Path $documents -ChildPath "PowerShell\$($junction.folder)"
            Get-Item -Path $link -Force -ErrorAction Ignore | Select-Object -Property FullName, LinkType, Target
        }
      testScript: |
        param($Junctions)
        $documents = [Environment]::GetFolderPath('MyDocuments')
        -not ($Junctions | Where-Object -FilterScript {
                $link = Join-Path -Path $documents -ChildPath "PowerShell\$($_.folder)"
                $target = [IO.Path]::GetFullPath([Environment]::ExpandEnvironmentVariables($_.target)).TrimEnd('\')
                $item = Get-Item -Path $link -Force -ErrorAction Ignore
                -not (($item.LinkType -eq 'Junction') -and ("$($item.Target)".TrimEnd('\') -eq $target))
            })
      setScript: |
        param($Junctions)


        function Move-Missing {
            <#
            .SYNOPSIS
            Moves what a folder has and another lacks into it, item by item down to -Depth levels.
            #>
            [CmdletBinding(SupportsShouldProcess, ConfirmImpact = 'Medium')]
            param(
                # The folder to move from.
                [Parameter(Mandatory)]
                [string]$From,

                # The folder to move into.
                [Parameter(Mandatory)]
                [string]$To,

                # How many levels further down to look inside a folder both have.
                [Parameter(Mandatory)]
                [int]$Depth
            )

            foreach ($item in Get-ChildItem -Path $From -Force) {
                $dest = Join-Path -Path $To -ChildPath $item.Name
                if (-not (Test-Path -Path $dest)) {
                    if ($PSCmdlet.ShouldProcess($item.FullName, "Move to $dest")) {
                        Move-Item -Path $item.FullName -Destination $dest
                    }
                } elseif ($item.PSIsContainer -and $Depth -gt 0) {
                    Move-Missing -From $item.FullName -To $dest -Depth ($Depth - 1)
                }
            }
        }


        $documents = [Environment]::GetFolderPath('MyDocuments')
        foreach ($junction in $Junctions) {
            $link = Join-Path -Path $documents -ChildPath "PowerShell\$($junction.folder)"
            $expanded = [Environment]::ExpandEnvironmentVariables($junction.target)
            $target = [IO.Path]::GetFullPath($expanded).TrimEnd('\')
            $item = Get-Item -Path $link -Force -ErrorAction Ignore
            if (($item.LinkType -eq 'Junction') -and ("$($item.Target)".TrimEnd('\') -eq $target)) {
                continue
            }
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            if ($item.LinkType) {
                # an existing link pointing elsewhere: remove only the link, never its target's contents
                [IO.Directory]::Delete($item.FullName)
            } elseif ($item) {
                Move-Missing -From $link -To $target -Depth 1
                if (Get-ChildItem -Path $link -Recurse -File -Force) {
                    Rename-Item -Path $link -NewName "$($junction.folder).$(Get-Date -Format yyyyMMddHHmmss).bak"
                } else {
                    Remove-Item -Path $link -Recurse -Force
                }
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Path $link) | Out-Null
            New-Item -ItemType Junction -Path $link -Target $target | Out-Null
        }
    metadata:
      description: Point the default CurrentUser Modules and Scripts folders at modulePath and scriptPath

  # From PSResourceGet 1.3.1, bundled with mise's pwsh 7.7.0; scripts/Invoke-Dsc.ps1 puts its folder on
  # DSC_RESOURCE_PATH. No uri, although the schema requires one: set passes it to Set-PSResourceRepository,
  # which refuses -Uri for PSGallery, so trusting an untrusted PSGallery failed with it. DSC 3.3.0 doesn't
  # enforce that requirement (checked 2026-11-16 on iris).
  - type: Microsoft.PowerShell.PSResourceGet/Repository
    name: Trust PSGallery Repository
    properties:
      name: PSGallery
      trusted: true
    metadata:
      description: Trust the PSGallery repository

  # PowerShell can't relocate $PROFILE, so the default profile files become stubs that dot-source
  # the custom location. The CurrentUserAllHosts stub only dot-sources; the CurrentUserCurrentHost
  # stub, which runs after it, also repoints $PROFILE.
  # (Microsoft.PowerShell/Profile isn't used: its get breaks on non-empty profiles. It ships with
  # PowerShell, not DSC, and fails under both DSC 3.2.3 and 3.3.0.)
  - type: Winfiles/FileContentList
    name: Redirect Profiles
    properties:
      files:
        - specialFolder: MyDocuments
          path: PowerShell\Microsoft.PowerShell_profile.ps1
          content: |
            # Managed by winfiles (dsc/modules/home/powershell.dsc.yaml): redirect $PROFILE to
            # ~/.config/powershell
            $PROFILE = & {
                $profileDir = Join-Path $HOME '.config/powershell'
                $currentUserCurrentHost = Join-Path $profileDir 'Microsoft.PowerShell_profile.ps1'
                $currentUserCurrentHost | Add-Member -PassThru -NotePropertyMembers ([ordered]@{
                    AllUsersAllHosts       = $PROFILE.AllUsersAllHosts
                    AllUsersCurrentHost    = $PROFILE.AllUsersCurrentHost
                    CurrentUserAllHosts    = Join-Path $profileDir 'profile.ps1'
                    CurrentUserCurrentHost = $currentUserCurrentHost
                })
            }
            if (Test-Path $PROFILE) { . $PROFILE }
        - specialFolder: MyDocuments
          path: PowerShell\profile.ps1
          content: |
            # Managed by winfiles (dsc/modules/home/powershell.dsc.yaml): redirect $PROFILE.CurrentUserAllHosts
            # to ~/.config/powershell
            if (Test-Path "$HOME/.config/powershell/profile.ps1") { . "$HOME/.config/powershell/profile.ps1" }
    metadata:
      description: Point the CurrentUserCurrentHost and CurrentUserAllHosts profiles at ~/.config/powershell
