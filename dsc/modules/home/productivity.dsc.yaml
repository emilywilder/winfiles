$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user document and notes tools. The office suite and LaTeX editor are in
# modules/system/productivity.dsc.yaml.
resources:
  # Document viewers
  - type: Winfiles.WinGet/Package
    name: SumatraPDF.SumatraPDF
    properties:
      id: SumatraPDF.SumatraPDF
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install SumatraPDF

  # Notes and Markdown editors
  - type: Winfiles.WinGet/Package
    name: Obsidian.Obsidian
    properties:
      id: Obsidian.Obsidian
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Obsidian

  - type: Winfiles.WinGet/Package
    name: Zettlr.Zettlr
    properties:
      id: Zettlr.Zettlr
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Zettlr

  - type: Winfiles.WinGet/Package
    name: MarkText.MarkText
    properties:
      id: MarkText.MarkText
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install MarkText

  - type: Winfiles/ScoopPackageList
    name: Productivity Scoop Apps
    properties:
      packages:
        # TeX engine
        - tectonic
    metadata:
      description: Ensure the TeX engine from Scoop is installed
