$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user document and notes tools. The office suite and LaTeX editor are in
# modules/system/productivity.dsc.yaml.
resources:
  - type: Winfiles/WinGetPackageList
    name: Productivity Apps
    properties:
      scope: User
      packages:
        # Document viewers
        - SumatraPDF.SumatraPDF
        # Notes and Markdown editors
        - Obsidian.Obsidian
        - Zettlr.Zettlr
        - MarkText.MarkText
    metadata:
      description: Ensure per-user document and notes tools are installed

  - type: Winfiles/ScoopPackageList
    name: Productivity Scoop Apps
    properties:
      packages:
        # TeX engine
        - tectonic
    metadata:
      description: Ensure the TeX engine from Scoop is installed
