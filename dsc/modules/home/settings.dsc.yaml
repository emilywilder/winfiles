$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user Windows settings. Everything here is under HKCU, so it runs unelevated.
parameters:
  explorerKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer'
    metadata:
      description: Registry key holding File Explorer's Quick Access settings
  explorerAdvancedKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    metadata:
      description: Registry key holding File Explorer's view settings
  taskbarDeveloperKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings'
    metadata:
      description: Registry key holding the taskbar's developer settings
  explorerPolicyKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Policies\Microsoft\Windows\Explorer'
    metadata:
      description: Registry key Windows reads its per-user Explorer policies from
  searchSettingsKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings'
    metadata:
      description: Registry key holding the Search settings
  personalizeKeyPath:
    type: string
    defaultValue: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    metadata:
      description: Registry key holding the light and dark theme settings

resources:
  # No metadata.description: DSC passes it to the resource as _metadata, which RegistryList counts as
  # a difference, so test would always report false
  - type: Microsoft.Windows/RegistryList
    name: User Settings
    properties:
      registryEntries:
        # Show hidden files in File Explorer (1 shows them, 2 hides them). Taken from Microsoft's
        # WindowsDeveloperConfig
        - keyPath: "[parameters('explorerAdvancedKeyPath')]"
          valueName: Hidden
          valueData:
            DWord: 1
        # Open File Explorer to This PC. Taken from Microsoft's WindowsDeveloperConfig, like the rest of this list
        - keyPath: "[parameters('explorerAdvancedKeyPath')]"
          valueName: LaunchTo
          valueData:
            DWord: 1
        # Show file extensions in File Explorer (0 shows them, 1 hides them)
        - keyPath: "[parameters('explorerAdvancedKeyPath')]"
          valueName: HideFileExt
          valueData:
            DWord: 0
        # Leave frequent folders out of Quick Access
        - keyPath: "[parameters('explorerKeyPath')]"
          valueName: ShowFrequent
          valueData:
            DWord: 0
        # Leave recent files out of Quick Access
        - keyPath: "[parameters('explorerKeyPath')]"
          valueName: ShowRecent
          valueData:
            DWord: 0
        # Leave recommended and cloud files out of Quick Access
        - keyPath: "[parameters('explorerKeyPath')]"
          valueName: ShowCloudFilesInQuickAccess
          valueData:
            DWord: 0
        # Add End Task to the right-click menu of taskbar icons
        - keyPath: "[parameters('taskbarDeveloperKeyPath')]"
          valueName: TaskbarEndTask
          valueData:
            DWord: 1
        # Turn off web results in Start and Search
        - keyPath: "[parameters('explorerPolicyKeyPath')]"
          valueName: DisableSearchBoxSuggestions
          valueData:
            DWord: 1
        # Turn off search highlights. Microsoft's WindowsDeveloperConfig sets this on a best-effort basis
        - keyPath: "[parameters('searchSettingsKeyPath')]"
          valueName: IsDynamicSearchBoxEnabled
          valueData:
            DWord: 0
        # Turn off recommendations in the Start menu
        - keyPath: "[parameters('explorerAdvancedKeyPath')]"
          valueName: Start_IrisRecommendations
          valueData:
            DWord: 0
        # Turn off account notifications in the Start menu
        - keyPath: "[parameters('explorerAdvancedKeyPath')]"
          valueName: Start_AccountNotifications
          valueData:
            DWord: 0
        # Use the light theme for apps and for Windows (1 is light, 0 is dark). Microsoft's WindowsDeveloperConfig
        # sets both to dark
        - keyPath: "[parameters('personalizeKeyPath')]"
          valueName: AppsUseLightTheme
          valueData:
            DWord: 1
        - keyPath: "[parameters('personalizeKeyPath')]"
          valueName: SystemUsesLightTheme
          valueData:
            DWord: 1
