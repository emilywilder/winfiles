$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user tools every host gets. Machine-wide ones are in modules/system/base.dsc.yaml.
# `_scope: User` makes winget pick a per-user installer, so an unelevated run raises no UAC prompt. A package
# with no such installer fails instead, and belongs in the matching modules/system document. It's
# Winfiles.WinGet/Package's stop-gap for a scope Microsoft.WinGet/Package lacks (docs/config/winget.md, "Drift from upstream").
resources:
  # Terminal and package tools
  - type: Winfiles.WinGet/Package
    name: Microsoft.WindowsTerminal
    properties:
      id: Microsoft.WindowsTerminal
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Windows Terminal

  - type: Winfiles.WinGet/Package
    name: Microsoft.AppInstaller
    properties:
      id: Microsoft.AppInstaller
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install App Installer (winget)

  - type: Winfiles.WinGet/Package
    name: jdx.mise
    properties:
      id: jdx.mise
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install mise

  # Password management
  - type: Winfiles.WinGet/Package
    name: AgileBits.1Password
    properties:
      id: AgileBits.1Password
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install 1Password

  - type: Winfiles.WinGet/Package
    name: AgileBits.1Password.CLI
    properties:
      id: AgileBits.1Password.CLI
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the 1Password CLI

  # Cloud storage
  - type: Winfiles.WinGet/Package
    name: Microsoft.OneDrive
    properties:
      id: Microsoft.OneDrive
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install OneDrive

  # System utilities and boot media
  - type: Winfiles.WinGet/Package
    name: Microsoft.Sysinternals.Autoruns
    properties:
      id: Microsoft.Sysinternals.Autoruns
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Autoruns

  - type: Winfiles.WinGet/Package
    name: Microsoft.PowerToys
    properties:
      id: Microsoft.PowerToys
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install PowerToys

  - type: Winfiles.WinGet/Package
    name: Rufus.Rufus
    properties:
      id: Rufus.Rufus
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Rufus

  - type: Winfiles/ScoopPackageList
    name: Base Scoop Apps
    properties:
      packages:
        # History, navigation and environment
        - atuin
        - fzf
        - direnv
        - psmux
        # Viewing and searching files
        - bat
        - eza
        - glow
        - less
        - ripgrep
        # Editor
        - neovim
        # Ports of Unix command-line tools
        - microsoft-coreutils
        - diffutils
        - sed
        - file
        - dos2unix
        - xz
        - util-linux-ng
        # Terminal font with Nerd Font symbols (Windows Terminal uses MesloLGM Nerd Font). Installed per
        # user, into %LOCALAPPDATA%\Microsoft\Windows\Fonts. Each manifest copies one variant from the
        # ryanoasis/nerd-fonts release: normal, Mono (single-width symbols) and Propo (proportional)
        - nerd-fonts/Meslo-NF
        - nerd-fonts/Meslo-NF-Mono
        - nerd-fonts/Meslo-NF-Propo
        - nerd-fonts/GeistMono-NF
        - nerd-fonts/GeistMono-NF-Mono
        - nerd-fonts/GeistMono-NF-Propo
    metadata:
      description: Ensure interactive shell tools, Unix tools and fonts are installed
