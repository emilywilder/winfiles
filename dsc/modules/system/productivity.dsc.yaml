$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Office and LaTeX tools with only a machine-wide installer. The rest are in
# modules/home/productivity.dsc.yaml.
# Left out: LyX.LyX, installed by hand. See dsc/hosts/<host>/manual.yaml
resources:
  - type: Winfiles/WinGetPackageList
    name: Productivity Apps
    properties:
      packages:
        - TheDocumentFoundation.LibreOffice
        - TeXstudio.TeXstudio
    metadata:
      description: Ensure the office suite and LaTeX editor are installed
