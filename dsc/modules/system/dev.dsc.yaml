$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Development tools with only a machine-wide installer. The rest are in modules/home/dev.dsc.yaml.
resources:
  - type: Winfiles/WinGetPackageList
    name: Dev Apps
    properties:
      packages:
        - GNU.Emacs
        - RProject.R
    metadata:
      description: Ensure machine-wide development tools are installed
