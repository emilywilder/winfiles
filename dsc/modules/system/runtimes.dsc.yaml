$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Runtimes that apps depend on. Runtimes that only games use are in gaming.dsc.yaml. MSIX frameworks (VCLibs, UI.Xaml,
# .NET Native, Windows App Runtime) aren't listed: the image and the Store supply most of them. One the image lacks is
# listed next to the app that needs it, as Install-WinGetPackage can fail to install it as a dependency.
# The lists only install: removing an id doesn't uninstall the package.
resources:
  - type: Winfiles/WinGetPackageList
    name: Runtimes
    properties:
      packages:
        # Microsoft Visual C++ redistributables
        - Microsoft.VCRedist.2005.x86
        - Microsoft.VCRedist.2005.x64
        - Microsoft.VCRedist.2008.x86
        - Microsoft.VCRedist.2008.x64
        - Microsoft.VCRedist.2010.x86
        - Microsoft.VCRedist.2010.x64
        - Microsoft.VCRedist.2012.x86
        - Microsoft.VCRedist.2012.x64
        - Microsoft.VCRedist.2013.x86
        - Microsoft.VCRedist.2013.x64
        - Microsoft.VCRedist.2015+.x86
        - Microsoft.VCRedist.2015+.x64
        # .NET runtimes and .NET Framework
        - Microsoft.DotNet.Runtime.6
        - Microsoft.DotNet.Runtime.8
        - Microsoft.DotNet.DesktopRuntime.8
        - Microsoft.DotNet.DesktopRuntime.10
        - Microsoft.DotNet.Framework.DeveloperPack.4.6
    metadata:
      description: Ensure Microsoft runtimes are installed
