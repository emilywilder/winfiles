$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Machine-wide Windows settings. Writing under HKLM needs an elevated shell.
parameters:
  fileSystemKeyPath:
    type: string
    defaultValue: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem'
    metadata:
      description: Registry key holding the NTFS and Win32 file system settings
  dshKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Policies\Microsoft\Dsh'
    metadata:
      description: Registry key Windows reads its Widgets policies from
  sudoKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Sudo'
    metadata:
      description: Registry key holding the Sudo for Windows mode

resources:
  # winget leaves out an explicit source unless a command names it, so plain `winget install`/`search` stop
  # asking to accept msstore's terms (which also sends your region). Store apps still install with
  # `--source msstore`. Package lists install from winget. Setting it needs an elevated shell, and a recent
  # App Installer, which scripts/Install-Winfiles.ps1 updates: winget 1.11 removes the source, then fails
  - type: Microsoft.WinGet/Source
    name: msstore
    properties:
      name: msstore
      explicit: true
    metadata:
      description: Only use the msstore source when a command names it

  # No metadata.description: DSC passes it to the resource as _metadata, which RegistryList counts as
  # a difference, so test would always report false
  - type: Microsoft.Windows/RegistryList
    name: System Settings
    properties:
      registryEntries:
        # Lets Win32 apps that declare longPathAware use paths over 260 characters. Git also needs
        # core.longpaths, which belongs to the dotfiles
        - keyPath: "[parameters('fileSystemKeyPath')]"
          valueName: LongPathsEnabled
          valueData:
            DWord: 1
        # Turn off Widgets. Microsoft's WindowsDeveloperConfig sets this on a best-effort basis, since
        # Windows may protect it
        - keyPath: "[parameters('dshKeyPath')]"
          valueName: AllowNewsAndInterests
          valueData:
            DWord: 0
        # Turn on Sudo for Windows in new-window mode (forceNewWindow), which runs the command in its own elevated
        # window. sudo still elevates through UAC. Microsoft recommends this mode and warns that sudo can be an
        # escalation of privilege vector in the others, which run the command in the current console: a malicious
        # unelevated process can try to drive it through the connection between the two sudo.exe processes. Inline
        # (normal) lets such a process send it input and read its output; input closed (disableInput) only stops
        # the input. WindowsDeveloperConfig uses inline (3), which is more convenient. Trade-off: elevated output
        # doesn't stay in the console you ran it from; revisit if that gets in the way
        - keyPath: "[parameters('sudoKeyPath')]"
          valueName: Enabled
          valueData:
            DWord: 1
