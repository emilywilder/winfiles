$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Machine-wide Windows settings. Writing under HKLM needs an elevated shell.
parameters:
  fileSystemKeyPath:
    type: string
    defaultValue: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem'
    metadata:
      description: Registry key holding the NTFS and Win32 file system settings
  dshKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Policies\Microsoft\Dsh'
    metadata:
      description: Registry key Windows reads its Widgets policies from
  explorerPolicyKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    metadata:
      description: Registry key Windows reads its machine-wide Explorer policies from
  sudoKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Sudo'
    metadata:
      description: Registry key holding the Sudo for Windows mode
  appModelUnlockKeyPath:
    type: string
    defaultValue: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
    metadata:
      description: Registry key holding the Developer Mode and sideloading settings

resources:
  # winget leaves out an explicit source unless a command names it, so plain `winget install`/`search` stop
  # asking to accept msstore's terms (which also sends your region). Store apps still install with
  # `--source msstore`. Package lists install from winget. Setting it needs an elevated shell, and a recent
  # App Installer, which scripts/Initialize-Winfiles.ps1 updates: winget 1.11 removes the source, then fails
  - type: Microsoft.WinGet/Source
    name: msstore
    properties:
      name: msstore
      explicit: true
    metadata:
      description: Only use the msstore source when a command names it

  # Register Microsoft Update with Automatic Updates ("Receive updates for other Microsoft products" in
  # Settings), so Windows Update also updates other Microsoft software. No built-in resource covers the Windows
  # Update Agent's service registration (Microsoft.Windows/UpdateList installs updates). `set` does what the
  # PowerShell MSI's RegisterMicrosoftUpdate.ps1 did for ENABLE_MU: AddService2 with flags 7 (allow pending and
  # online registration, register with AU), in a job with a timeout, since it can hang.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Microsoft Update
    properties:
      input:
        serviceId: 7971f918-a847-4430-9279-4a52d1efe18d
        timeoutSeconds: 300
      getScript: |
        param($Settings)
        $service = (New-Object -ComObject Microsoft.Update.ServiceManager).Services |
            Where-Object -Property ServiceID -EQ -Value $Settings.serviceId
        [pscustomobject]@{ ServiceId = $Settings.serviceId; IsRegisteredWithAU = [bool]$service.IsRegisteredWithAU }
      testScript: |
        param($Settings)
        $service = (New-Object -ComObject Microsoft.Update.ServiceManager).Services |
            Where-Object -Property ServiceID -EQ -Value $Settings.serviceId
        [bool]$service.IsRegisteredWithAU
      setScript: |
        param($Settings)
        $job = Start-ThreadJob -ArgumentList $Settings.serviceId -ScriptBlock {
            param($ServiceId)
            $null = (New-Object -ComObject Microsoft.Update.ServiceManager).AddService2($ServiceId, 7, '')
        }
        if (-not (Wait-Job -Job $job -Timeout $Settings.timeoutSeconds)) {
            Stop-Job -Job $job
            throw "Registering Microsoft Update timed out after $($Settings.timeoutSeconds)s"
        }
        Receive-Job -Job $job -ErrorAction Stop
    metadata:
      description: Register Microsoft Update with Automatic Updates

  # No metadata.description: DSC passes it to the resource as _metadata, which RegistryList counts as
  # a difference, so test would always report false
  - type: Microsoft.Windows/RegistryList
    name: System Settings
    properties:
      registryEntries:
        # Lets Win32 apps that declare longPathAware use paths over 260 characters. Git also needs
        # core.longpaths, which belongs to the dotfiles
        - keyPath: "[parameters('fileSystemKeyPath')]"
          valueName: LongPathsEnabled
          valueData:
            DWord: 1
        # Turn off Widgets. Microsoft's WindowsDeveloperConfig sets this on a best-effort basis, since
        # Windows may protect it
        - keyPath: "[parameters('dshKeyPath')]"
          valueName: AllowNewsAndInterests
          valueData:
            DWord: 0
        # Turn off web results in Start and Search. The ADMX defines this policy for users only
        # (HKCU\Software\Policies), but a standard user can only read that key, so the unelevated home
        # configuration can't set it on a new install ("Registry error", seen in the test VM 2026-11-15). Windows
        # also honours the HKLM value: with only this set, Start's search showed no web results (test VM, build
        # 26300, 2026-11-15). Trade-off: it applies to every account on the machine; revisit if one should keep them,
        # or if a Windows update stops honouring the HKLM value. WindowsDeveloperConfig sets the HKCU value from an
        # elevated process instead; see docs/config/settings.md
        - keyPath: "[parameters('explorerPolicyKeyPath')]"
          valueName: DisableSearchBoxSuggestions
          valueData:
            DWord: 1
        # Turn on Sudo for Windows in new-window mode (forceNewWindow), which runs the command in its own elevated
        # window. sudo still elevates through UAC. Microsoft recommends this mode and warns that sudo can be an
        # escalation of privilege vector in the others, which run the command in the current console: a malicious
        # unelevated process can try to drive it through the connection between the two sudo.exe processes. Inline
        # (normal) lets such a process send it input and read its output; input closed (disableInput) only stops
        # the input. WindowsDeveloperConfig uses inline (3), which is more convenient. Trade-off: elevated output
        # doesn't stay in the console you ran it from; revisit if that gets in the way
        - keyPath: "[parameters('sudoKeyPath')]"
          valueName: Enabled
          valueData:
            DWord: 1
        # Keep Developer Mode off (1 turns it on, as WindowsDeveloperConfig does). Developer Mode lets apps be
        # sideloaded and debugged without a developer licence, and lets any user create symbolic links without
        # elevation. Turned on in Settings, it also offers Device Portal and Device Discovery, which starts an SSH
        # service for remote app deployment (not OpenSSH; Microsoft says it isn't yet protocol compliant). Writing
        # this value alone doesn't start that service. Microsoft says ordinary use doesn't need Developer Mode.
        # Trade-off: debugging packaged apps locally, and tools that create symbolic links unelevated (git's
        # core.symlinks, for one), don't work; revisit if you start needing them
        - keyPath: "[parameters('appModelUnlockKeyPath')]"
          valueName: AllowDevelopmentWithoutDevLicense
          valueData:
            DWord: 0
