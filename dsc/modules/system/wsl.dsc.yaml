$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Inbound access to WSL from the network: SSH into a WSL distribution from the local network only, nothing else.
# With networkingMode=mirrored (a user's ~/.wslconfig, e.g. dsc/users/emily@iris/wsl.dsc.yaml), inbound traffic to WSL
# is filtered by the Hyper-V firewall, per VM creator, not by the host's own rules (host rules without a program are
# merged into it too). The rule covers every distribution, since they share WSL's one VM.
# The sshd itself, on sshPort, belongs to the distribution's own configuration.
# Microsoft.Windows/FirewallRuleList was ruled out: it manages host firewall rules (INetFwRule), which
# have no VM creator, and has no Hyper-V firewall settings. So this uses the NetSecurity cmdlets.
# Reading needs no elevation, so `test` stays unelevated; `set` needs an elevated shell, so this is in
# the system configuration.
parameters:
  wslVmCreatorId:
    type: string
    defaultValue: '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}'
    metadata:
      description: Hyper-V firewall VM creator id that WSL registers
  sshPort:
    type: int
    defaultValue: 2122
    metadata:
      description: TCP port sshd listens on inside WSL (set in the distribution's configuration)

resources:
  # Without this, every port a distribution listens on is reachable from any network, Public included
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: WSL Inbound Default
    properties:
      input:
        vmCreatorId: "[parameters('wslVmCreatorId')]"
        defaultInboundAction: Block
      getScript: |
        param($Desired)
        Get-NetFirewallHyperVProfile -PolicyStore ActiveStore |
            Where-Object -Property VMCreatorId -EQ -Value $Desired.vmCreatorId |
            ForEach-Object -Process {
                [pscustomobject]@{ Profile = "$($_.Profile)"; DefaultInboundAction = "$($_.DefaultInboundAction)" }
            }
      testScript: |
        param($Desired)
        $profiles = @(Get-NetFirewallHyperVProfile -PolicyStore ActiveStore |
                Where-Object -Property VMCreatorId -EQ -Value $Desired.vmCreatorId)
        $profiles.Count -gt 0 -and -not ($profiles | Where-Object -FilterScript {
                "$($_.DefaultInboundAction)" -ne $Desired.defaultInboundAction
            })
      # WSL doesn't register its VM creator when it's installed or when its service starts (seen without Hyper-V), so
      # on a new install this creates the setting, which also blocks anything a distribution starts up with.
      # Set on the VM creator and on each of its profiles: a profile's own setting overrides the creator's
      setScript: |
        param($Desired)
        $setting = @{ Name = $Desired.vmCreatorId; DefaultInboundAction = $Desired.defaultInboundAction }
        $existing = @{ PolicyStore = 'PersistentStore'; Name = $Desired.vmCreatorId; ErrorAction = 'SilentlyContinue' }
        if (Get-NetFirewallHyperVVMSetting @existing) {
            Set-NetFirewallHyperVVMSetting @setting
        } else {
            New-NetFirewallHyperVVMSetting @setting | Out-Null
        }
        Get-NetFirewallHyperVProfile -PolicyStore PersistentStore |
            Where-Object -Property VMCreatorId -EQ -Value $Desired.vmCreatorId |
            Set-NetFirewallHyperVProfile -DefaultInboundAction $Desired.defaultInboundAction
    metadata:
      description: Block inbound connections to WSL unless a rule allows them

  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: WSL SSH Rule
    properties:
      input:
        name: Winfiles-WSL-SSH-In
        displayName: WSL sshd (TCP-In, local subnet)
        vmCreatorId: "[parameters('wslVmCreatorId')]"
        direction: Inbound
        protocol: TCP
        localPorts: "[string(parameters('sshPort'))]"
        remoteAddresses: LocalSubnet
        profiles: Private
        action: Allow
      getScript: |
        param($Rule)
        Get-NetFirewallHyperVRule -Name $Rule.name -ErrorAction SilentlyContinue |
            Select-Object -Property Name, DisplayName, VMCreatorId, Direction, Protocol, LocalPorts, RemoteAddresses,
                Profiles, Action, Enabled
      testScript: |
        param($Rule)
        $actual = Get-NetFirewallHyperVRule -Name $Rule.name -ErrorAction SilentlyContinue
        $compared = 'displayName', 'vmCreatorId', 'direction', 'protocol', 'localPorts', 'remoteAddresses', 'profiles',
            'action'
        [bool]$actual -and "$($actual.Enabled)" -eq 'True' -and -not (
            $compared | Where-Object -FilterScript { "$($actual.$_)" -ne "$($Rule.$_)" })
      # Recreated rather than updated: Set-NetFirewallHyperVRule can't change the VM creator
      setScript: |
        param($Rule)
        Remove-NetFirewallHyperVRule -Name $Rule.name -ErrorAction SilentlyContinue
        $newRule = @{
            Name            = $Rule.name
            DisplayName     = $Rule.displayName
            VMCreatorId     = $Rule.vmCreatorId
            Direction       = $Rule.direction
            Protocol        = $Rule.protocol
            LocalPorts      = $Rule.localPorts
            RemoteAddresses = $Rule.remoteAddresses
            Profiles        = $Rule.profiles
            Action          = $Rule.action
            Enabled         = 'True'
        }
        New-NetFirewallHyperVRule @newRule | Out-Null
    metadata:
      description: Allow SSH into WSL from the local subnet, on Private networks only
