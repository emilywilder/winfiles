$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3
    # Every resource here needs elevation (Microsoft.Windows/OptionalFeatureList does even for `test`). Only winfiles
    # reads this: DSC ignores it, and the flat copies leave it out
    securityContext: elevated
  winfiles:
    # Resources of this stage are applied apart from the rest, with a restart between if Windows then has one pending
    stage: restart

# What the vm-quick host needs a restart for, and so applies before anything that installs: its Windows optional
# features, WSL and the computer's name. dsc/vm-quick.system.dsc.yaml includes this first, so just system and just
# check run it with the rest. just system vm-quick tests this first, which shows ahead of time that the
# set will need a restart (each resource reports it to DSC as `_restartRequired`), applies what differs, and restarts
# once if Windows then has one pending, which applies the rename too.
# Paths resolve from this file's folder, and DSC refuses `..`, so entries like this one stay directly in dsc/.
resources:
  - type: Microsoft.DSC/Include
    name: Features
    properties:
      configurationFile: hosts/vm-quick/features.dsc.yaml
    metadata:
      description: Enable Virtual Machine Platform

  - type: Microsoft.DSC/Include
    name: WSL
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Features')]"
    properties:
      configurationFile: modules/system/wsl-platform.dsc.yaml
    metadata:
      description: Install WSL

  - type: Microsoft.DSC/Include
    name: Computer Name
    properties:
      configurationFile: hosts/vm-quick/computername.dsc.yaml
    metadata:
      description: Name the computer after its host