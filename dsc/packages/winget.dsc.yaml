$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# WinGet packages, one Winfiles/WinGetPackageList per category (comments group them by purpose).
# Each list is checked with a single listing of installed packages instead of a lookup per id.
# The lists only install: removing an id doesn't uninstall the package.
# Winfiles/WinGetPackageList lives in dsc/resources, so run this through `just dsc` (scripts/Invoke-Dsc.ps1).
# Generated from `dsc resource export` of Microsoft.WinGet/Package, leaving out packages managed elsewhere:
#   - Microsoft.PowerShell: dsc/powershell/pwsh.dsc.yaml
#   - DSC: mise.toml
#   - JetBrains.IntelliJIDEA: installed and updated through JetBrains Toolbox
#   - Blizzard.BattleNet: installed by hand. Its winget installer requires an install location, which
#     neither Winfiles/WinGetPackageList nor Microsoft.WinGet/Package passes, winget upgrades of it fail
#     the same way, and it updates itself anyway
parameters:
  source:
    type: string
    defaultValue: winget
    metadata:
      description: WinGet source the packages are installed from

resources:
  - type: Winfiles/WinGetPackageList
    name: Libraries
    properties:
      source: "[parameters('source')]"
      packages:
        # Microsoft framework packages (VCLibs, WinUI)
        - Microsoft.VCLibs.14
        - Microsoft.VCLibs.Desktop.14
        - Microsoft.UI.Xaml.2.6
        - Microsoft.UI.Xaml.2.7
        - Microsoft.UI.Xaml.2.8
    metadata:
      description: Ensure framework packages that apps depend on are installed

  - type: Winfiles/WinGetPackageList
    name: Runtimes
    properties:
      source: "[parameters('source')]"
      packages:
        # Microsoft Visual C++ redistributables
        - Microsoft.VCRedist.2005.x86
        - Microsoft.VCRedist.2005.x64
        - Microsoft.VCRedist.2008.x86
        - Microsoft.VCRedist.2008.x64
        - Microsoft.VCRedist.2010.x86
        - Microsoft.VCRedist.2010.x64
        - Microsoft.VCRedist.2012.x86
        - Microsoft.VCRedist.2012.x64
        - Microsoft.VCRedist.2013.x86
        - Microsoft.VCRedist.2013.x64
        - Microsoft.VCRedist.2015+.x86
        - Microsoft.VCRedist.2015+.x64
        # .NET runtimes and .NET Framework
        - Microsoft.DotNet.Runtime.6
        - Microsoft.DotNet.Runtime.8
        - Microsoft.DotNet.DesktopRuntime.8
        - Microsoft.DotNet.DesktopRuntime.10
        - Microsoft.DotNet.Native.Runtime
        - Microsoft.DotNet.Framework.DeveloperPack.4.6
        # Windows App SDK runtimes
        - Microsoft.WindowsAppRuntime.1.1
        - Microsoft.WindowsAppRuntime.1.2
        - Microsoft.WindowsAppRuntime.1.3
        - Microsoft.WindowsAppRuntime.1.4
        - Microsoft.WindowsAppRuntime.1.5
        - Microsoft.WindowsAppRuntime.1.6
        - Microsoft.WindowsAppRuntime.1.7
        - Microsoft.WindowsAppRuntime.1.8
        - Microsoft.WindowsAppRuntime.2
        # Runtimes that games depend on
        - Microsoft.DirectX
        - Microsoft.XNARedist
        - Microsoft.GameInput
        - Nvidia.PhysX
        - Nvidia.PhysXLegacy
        - CreativeTechnology.OpenAL
    metadata:
      description: Ensure Microsoft and gaming runtimes are installed

  - type: Winfiles/WinGetPackageList
    name: Development
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Editors and IDEs (JetBrains Toolbox manages IntelliJ IDEA)
        - Microsoft.VisualStudioCode
        - GNU.Emacs
        - JetBrains.Toolbox
        - JetBrains.Air.Preview
        # Language toolchains (Python comes from Scoop: dsc/packages/scoop.dsc.yaml)
        - RProject.R
        - Posit.RStudio
        # Kubernetes (WSL comes from `just wsl-install`, which also enables Virtual Machine Platform)
        - Kubernetes.kubectl
        # Development tools (Meld comes from Scoop: dsc/packages/scoop.dsc.yaml)
        - jdx.mise
        - GitHub.GitHubDesktop
        - Microsoft.NuGet
        - Microsoft.WinDbg
        # Terminal and shell tools
        - Microsoft.WindowsTerminal
        - gerardog.gsudo
        - JanDeDobbeleer.OhMyPosh
        # AI assistants and local model runners
        - Anthropic.Claude
        - Anthropic.ClaudeCode
        - GitHub.Copilot
        - Ollama.Ollama
        - ElementLabs.LMStudio
    metadata:
      description: Ensure editors, languages, Kubernetes, development tools and AI tools are installed

  - type: Winfiles/WinGetPackageList
    name: Gaming
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Game stores, launchers and emulator frontends
        - Valve.Steam
        - GOG.Galaxy
        - goatcorp.XIVLauncher
        - Libretro.RetroArch
        # Controller and RGB peripheral software
        - PlayStation.PlayStationAccessories
        - Corsair.iCUE.5
        - AndrewAlanBabbitt.ChromaControl
        # Game modding tools
        - RankFTW.RHI
    metadata:
      description: Ensure game launchers, peripheral software and modding tools are installed

  - type: Winfiles/WinGetPackageList
    name: Utilities
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Hardware information, drivers and boot media
        - CPUID.CPU-Z
        - TechPowerUp.GPU-Z
        - namazso.PawnIO
        - NirSoft.USBLogView
        - GlennDelahoy.SnappyDriverInstallerOrigin
        - Rufus.Rufus
        # System utilities
        - Microsoft.AppInstaller
        - Microsoft.Sysinternals.Autoruns
        - Cairo.Cairo
        # Archives, disk usage and cloud storage
        - Giorgiotani.Peazip
        - WinDirStat.WinDirStat
        - Microsoft.OneDrive
        - Proton.ProtonDrive
        # Networking, VPN and remote access
        - Proton.ProtonVPN
        - WiresharkFoundation.Wireshark
        - Microsoft.WindowsApp
        - KDE.KDEConnect
        # Password management and malware protection
        - AgileBits.1Password
        - AgileBits.1Password.CLI
        - Malwarebytes.Malwarebytes
    metadata:
      description: Ensure hardware, system, file, network and security utilities are installed

  - type: Winfiles/WinGetPackageList
    name: Internet
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Web browsers (Brave policies are in dsc/policies/brave.dsc.yaml)
        - Brave.Brave
        - Mozilla.Firefox
        - LibreWolf.LibreWolf
        - eloston.ungoogled-chromium
        - Microsoft.Edge
        # Mail and chat
        - Mozilla.Thunderbird
        - Proton.ProtonMailBridge
        - Microsoft.Outlook
        - Discord.Discord
        - Element.Element
    metadata:
      description: Ensure browsers and communication clients are installed

  - type: Winfiles/WinGetPackageList
    name: Productivity
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Office suite and document viewers
        - TheDocumentFoundation.LibreOffice
        - SumatraPDF.SumatraPDF
        # Notes and Markdown editors
        - Obsidian.Obsidian
        - Zettlr.Zettlr
        - MarkText.MarkText
        # LaTeX editors
        - TeXstudio.TeXstudio
        - LyX.LyX
    metadata:
      description: Ensure office, notes and LaTeX tools are installed

  - type: Winfiles/WinGetPackageList
    name: Media
    dependsOn:
      - "[resourceId('Winfiles/WinGetPackageList', 'Libraries')]"
      - "[resourceId('Winfiles/WinGetPackageList', 'Runtimes')]"
    properties:
      source: "[parameters('source')]"
      packages:
        # Audio and video players
        - VideoLAN.VLC
        - PeterPawlowski.foobar2000
        # Graphics, image processing and streaming
        - Canva.Affinity
        - ImageMagick.ImageMagick
        - MeldStudio.MeldStudio
    metadata:
      description: Ensure media players and creative tools are installed
