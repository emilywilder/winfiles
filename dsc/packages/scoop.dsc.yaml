$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Scoop apps, one Winfiles/ScoopPackageList per category (comments group them by purpose).
# Each list is checked by reading Scoop's apps and buckets folders, not by running Scoop.
# The lists only install: removing an app doesn't uninstall it.
# Scoop's installer and apps with env_add_path in their manifest (nodejs, python, ...) add to the
# persistent user PATH. That's allowed for Scoop.
# Winfiles/Scoop and Winfiles/ScoopPackageList live in dsc/resources, so run this through `just dsc`
# (scripts/Invoke-Dsc.ps1). Scoop itself is installed by Winfiles/Scoop, which every list follows through
# Core. Its installer refuses an elevated shell, so `set` this from a normal one: winfiles.user.dsc.yaml
# runs unelevated, but a `set` of the whole winfiles.dsc.yaml doesn't.
# Generated from `scoop list`.
parameters:
  scoopInstaller:
    type: string
    defaultValue: https://get.scoop.sh
    metadata:
      description: URL of Scoop's install script (only used when Scoop is missing)
  buckets:
    type: object
    defaultValue:
      main: https://github.com/ScoopInstaller/Main.git
      extras: https://github.com/ScoopInstaller/Extras
      nerd-fonts: https://github.com/matthewjberger/scoop-nerd-fonts
    metadata:
      description: Scoop buckets as name and repository URL

resources:
  - type: Winfiles/Scoop
    name: Scoop
    properties:
      installerUrl: "[parameters('scoopInstaller')]"
    metadata:
      description: Ensure Scoop itself is installed (its installer adds the main bucket)

  - type: Winfiles/ScoopPackageList
    name: Core
    # No buckets: main comes with Scoop, and adding any other bucket needs the git installed here.
    # The other lists depend on Core, so they follow Scoop through it
    dependsOn:
      - "[resourceId('Winfiles/Scoop', 'Scoop')]"
    properties:
      packages:
        - git
        # Extractors and certificates that Scoop and other apps' installs use
        - 7zip
        - innounp
        - dark
        - cacert
        - scoop-search
    metadata:
      description: Ensure git and the tools Scoop installs depend on are installed

  - type: Winfiles/ScoopPackageList
    name: Shell
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        # History, navigation and environment
        - atuin
        - fzf
        - direnv
        - psmux
        # Viewing and searching files
        - bat
        - eza
        - glow
        - less
        - ripgrep
        # Editor
        - neovim
    metadata:
      description: Ensure interactive shell tools are installed

  - type: Winfiles/ScoopPackageList
    name: Unix Tools
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        - microsoft-coreutils
        - diffutils
        - sed
        - file
        - dos2unix
        - xz
        - util-linux-ng
    metadata:
      description: Ensure ports of Unix command-line tools are installed

  - type: Winfiles/ScoopPackageList
    name: Development
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        # Languages and their package managers
        - nodejs
        - python
        - uv
        # Task runner and linters
        - just
        - shellcheck
        # JSON, YAML and XML
        - jq
        - yq
        - dyff
        - xmlstarlet
        # Diff and hex editors
        - meld
        - imhex
    metadata:
      description: Ensure development tools are installed

  - type: Winfiles/ScoopPackageList
    name: Utilities
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        # Display driver removal and fan curves
        - ddu
        - fancontrol
    metadata:
      description: Ensure system utilities are installed

  - type: Winfiles/ScoopPackageList
    name: Fonts
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        # Terminal font with Nerd Font symbols (Windows Terminal uses MesloLGM Nerd Font). Installed per
        # user, into %LOCALAPPDATA%\Microsoft\Windows\Fonts. Each manifest copies one variant from the
        # ryanoasis/nerd-fonts release: normal, Mono (single-width symbols) and Propo (proportional)
        - nerd-fonts/Meslo-NF
        - nerd-fonts/Meslo-NF-Mono
        - nerd-fonts/Meslo-NF-Propo
    metadata:
      description: Ensure fonts are installed

  - type: Winfiles/ScoopPackageList
    name: Internet
    dependsOn:
      - "[resourceId('Winfiles/ScoopPackageList', 'Core')]"
    properties:
      buckets: "[parameters('buckets')]"
      packages:
        # Chat (from Scoop rather than winget: winget's installer starts Discord, which asks for UAC mid-run)
        - extras/discord
    metadata:
      description: Ensure communication clients are installed
