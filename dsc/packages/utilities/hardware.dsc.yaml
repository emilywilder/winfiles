$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Hardware information, drivers and boot media
resources:
  - type: Microsoft.WinGet/Package
    name: CPU-Z
    properties:
      id: CPUID.CPU-Z
      source: winget
    metadata:
      description: Install CPU-Z

  - type: Microsoft.WinGet/Package
    name: GPU-Z
    properties:
      id: TechPowerUp.GPU-Z
      source: winget
    metadata:
      description: Install GPU-Z

  - type: Microsoft.WinGet/Package
    name: PawnIO
    properties:
      id: namazso.PawnIO
      source: winget
    metadata:
      description: Install the PawnIO driver (hardware access for monitoring tools)

  - type: Microsoft.WinGet/Package
    name: USBLogView
    properties:
      id: NirSoft.USBLogView
      source: winget
    metadata:
      description: Install USBLogView (logs USB device connections)

  - type: Microsoft.WinGet/Package
    name: Snappy Driver Installer Origin
    properties:
      id: GlennDelahoy.SnappyDriverInstallerOrigin
      source: winget
    metadata:
      description: Install Snappy Driver Installer Origin

  - type: Microsoft.WinGet/Package
    name: Rufus
    properties:
      id: Rufus.Rufus
      source: winget
    metadata:
      description: Install Rufus (bootable USB creator)
