$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Archives, disk usage and cloud storage
resources:
  - type: Microsoft.WinGet/Package
    name: PeaZip
    properties:
      id: Giorgiotani.Peazip
      source: winget
    metadata:
      description: Install the PeaZip archiver

  - type: Microsoft.WinGet/Package
    name: WinDirStat
    properties:
      id: WinDirStat.WinDirStat
      source: winget
    metadata:
      description: Install WinDirStat (disk usage)

  - type: Microsoft.WinGet/Package
    name: Microsoft OneDrive
    properties:
      id: Microsoft.OneDrive
      source: winget
    metadata:
      description: Install Microsoft OneDrive

  - type: Microsoft.WinGet/Package
    name: Proton Drive
    properties:
      id: Proton.ProtonDrive
      source: winget
    metadata:
      description: Install Proton Drive
