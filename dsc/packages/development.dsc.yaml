$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Development. Paths are relative to dsc/: nested Includes resolve from
# the top-level document's folder (dsc/winfiles.dsc.yaml), not from this file.
resources:
  - type: Microsoft.DSC/Include
    name: Editors
    properties:
      configurationFile: packages/development/editors.dsc.yaml
    metadata:
      description: Install editors and IDEs

  - type: Microsoft.DSC/Include
    name: Languages
    properties:
      configurationFile: packages/development/languages.dsc.yaml
    metadata:
      description: Install language toolchains

  - type: Microsoft.DSC/Include
    name: Containers
    properties:
      configurationFile: packages/development/containers.dsc.yaml
    metadata:
      description: Install WSL, Podman and kubectl

  - type: Microsoft.DSC/Include
    name: Development Tools
    properties:
      configurationFile: packages/development/tools.dsc.yaml
    metadata:
      description: Install development tools

  - type: Microsoft.DSC/Include
    name: Shell
    properties:
      configurationFile: packages/development/shell.dsc.yaml
    metadata:
      description: Install terminal and shell tools

  - type: Microsoft.DSC/Include
    name: AI
    properties:
      configurationFile: packages/development/ai.dsc.yaml
    metadata:
      description: Install AI assistants and local model runners
