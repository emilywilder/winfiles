$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Microsoft framework packages that Store/MSIX apps depend on
resources:
  - type: Microsoft.WinGet/Package
    name: Microsoft Visual C++ 2015 UWP Runtime Package
    properties:
      id: Microsoft.VCLibs.14
      source: winget
    metadata:
      description: Install the VC++ 14 UWP runtime framework package

  - type: Microsoft.WinGet/Package
    name: Microsoft Visual C++ 2015 UWP Desktop Runtime Package
    properties:
      id: Microsoft.VCLibs.Desktop.14
      source: winget
    metadata:
      description: Install the VC++ 14 UWP desktop runtime framework package

  - type: Microsoft.WinGet/Package
    name: Microsoft.UI.Xaml 2.6
    properties:
      id: Microsoft.UI.Xaml.2.6
      source: winget
    metadata:
      description: Install the WinUI 2.6 framework package

  - type: Microsoft.WinGet/Package
    name: Microsoft.UI.Xaml 2.7
    properties:
      id: Microsoft.UI.Xaml.2.7
      source: winget
    metadata:
      description: Install the WinUI 2.7 framework package

  - type: Microsoft.WinGet/Package
    name: Microsoft.UI.Xaml 2.8
    properties:
      id: Microsoft.UI.Xaml.2.8
      source: winget
    metadata:
      description: Install the WinUI 2.8 framework package
