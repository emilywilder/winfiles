$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Web browsers (Brave policies are in dsc/policies/brave.dsc.yaml)
resources:
  - type: Microsoft.WinGet/Package
    name: Brave
    properties:
      id: Brave.Brave
      source: winget
    metadata:
      description: Install Brave

  - type: Microsoft.WinGet/Package
    name: Firefox
    properties:
      id: Mozilla.Firefox
      source: winget
    metadata:
      description: Install Mozilla Firefox

  - type: Microsoft.WinGet/Package
    name: LibreWolf
    properties:
      id: LibreWolf.LibreWolf
      source: winget
    metadata:
      description: Install LibreWolf

  - type: Microsoft.WinGet/Package
    name: ungoogled-chromium
    properties:
      id: eloston.ungoogled-chromium
      source: winget
    metadata:
      description: Install ungoogled-chromium

  - type: Microsoft.WinGet/Package
    name: Microsoft Edge
    properties:
      id: Microsoft.Edge
      source: winget
    metadata:
      description: Install Microsoft Edge
