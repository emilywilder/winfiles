$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Notes and Markdown editors
resources:
  - type: Microsoft.WinGet/Package
    name: Obsidian
    properties:
      id: Obsidian.Obsidian
      source: winget
    metadata:
      description: Install Obsidian

  - type: Microsoft.WinGet/Package
    name: Zettlr
    properties:
      id: Zettlr.Zettlr
      source: winget
    metadata:
      description: Install Zettlr

  - type: Microsoft.WinGet/Package
    name: MarkText
    properties:
      id: MarkText.MarkText
      source: winget
    metadata:
      description: Install MarkText
