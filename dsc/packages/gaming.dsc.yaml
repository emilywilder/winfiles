$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Gaming. Paths are relative to dsc/: nested Includes resolve from
# the top-level document's folder (dsc/winfiles.dsc.yaml), not from this file.
resources:
  - type: Microsoft.DSC/Include
    name: Game Launchers
    properties:
      configurationFile: packages/gaming/launchers.dsc.yaml
    metadata:
      description: Install game stores, launchers and emulator frontends

  - type: Microsoft.DSC/Include
    name: Gaming Peripherals
    properties:
      configurationFile: packages/gaming/peripherals.dsc.yaml
    metadata:
      description: Install controller and RGB peripheral software

  - type: Microsoft.DSC/Include
    name: Gaming Tools
    properties:
      configurationFile: packages/gaming/tools.dsc.yaml
    metadata:
      description: Install game modding tools
