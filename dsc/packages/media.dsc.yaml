$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Media. Paths are relative to dsc/: nested Includes resolve from
# the top-level document's folder (dsc/winfiles.dsc.yaml), not from this file.
resources:
  - type: Microsoft.DSC/Include
    name: Media Playback
    properties:
      configurationFile: packages/media/playback.dsc.yaml
    metadata:
      description: Install audio and video players

  - type: Microsoft.DSC/Include
    name: Creative
    properties:
      configurationFile: packages/media/creative.dsc.yaml
    metadata:
      description: Install graphics, image processing and streaming tools
