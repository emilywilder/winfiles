$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# AI assistants and local model runners
resources:
  - type: Microsoft.WinGet/Package
    name: Claude
    properties:
      id: Anthropic.Claude
      source: winget
    metadata:
      description: Install the Claude desktop app

  - type: Microsoft.WinGet/Package
    name: Claude Code
    properties:
      id: Anthropic.ClaudeCode
      source: winget
    metadata:
      description: Install the Claude Code CLI

  - type: Microsoft.WinGet/Package
    name: GitHub Copilot CLI
    properties:
      id: GitHub.Copilot
      source: winget
    metadata:
      description: Install the GitHub Copilot CLI

  - type: Microsoft.WinGet/Package
    name: Ollama
    properties:
      id: Ollama.Ollama
      source: winget
    metadata:
      description: Install Ollama (local model runner)

  - type: Microsoft.WinGet/Package
    name: LM Studio
    properties:
      id: ElementLabs.LMStudio
      source: winget
    metadata:
      description: Install LM Studio (local model runner)
