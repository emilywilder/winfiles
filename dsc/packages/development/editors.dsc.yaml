$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Editors and IDEs
resources:
  - type: Microsoft.WinGet/Package
    name: Visual Studio Code
    properties:
      id: Microsoft.VisualStudioCode
      source: winget
    metadata:
      description: Install Visual Studio Code

  - type: Microsoft.WinGet/Package
    name: GNU Emacs
    properties:
      id: GNU.Emacs
      source: winget
    metadata:
      description: Install GNU Emacs

  - type: Microsoft.WinGet/Package
    name: JetBrains Toolbox
    properties:
      id: JetBrains.Toolbox
      source: winget
    metadata:
      description: Install JetBrains Toolbox (manages IntelliJ IDEA and other JetBrains IDEs)

  - type: Microsoft.WinGet/Package
    name: JetBrains Air
    properties:
      id: JetBrains.Air.Preview
      source: winget
    metadata:
      description: Install JetBrains Air (public preview)
