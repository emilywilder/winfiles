$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Language toolchains
resources:
  - type: Microsoft.WinGet/Package
    name: Python 3.13
    properties:
      id: Python.Python.3.13
      source: winget
    metadata:
      description: Install Python 3.13

  - type: Microsoft.WinGet/Package
    name: R
    properties:
      id: RProject.R
      source: winget
    metadata:
      description: Install R for Windows

  - type: Microsoft.WinGet/Package
    name: RStudio
    properties:
      id: Posit.RStudio
      source: winget
    metadata:
      description: Install the RStudio IDE for R
