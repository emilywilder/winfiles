$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# WSL, containers and Kubernetes
resources:
  - type: Microsoft.WinGet/Package
    name: Windows Subsystem for Linux
    properties:
      id: Microsoft.WSL
      source: winget
    metadata:
      description: Install WSL (also the Podman machine backend)

  - type: Microsoft.WinGet/Package
    name: Podman CLI
    properties:
      id: Podman.CLI
      source: winget
    metadata:
      description: Install the Podman container CLI

  - type: Microsoft.WinGet/Package
    name: Podman Desktop
    properties:
      id: RedHat.Podman-Desktop
      source: winget
    metadata:
      description: Install Podman Desktop

  - type: Microsoft.WinGet/Package
    name: kubectl
    properties:
      id: Kubernetes.kubectl
      source: winget
    metadata:
      description: Install the Kubernetes CLI
