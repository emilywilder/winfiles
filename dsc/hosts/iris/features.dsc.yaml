$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The Windows optional features iris uses. Microsoft.Windows/OptionalFeatureList needs an elevated
# shell even for `get` (DSC refuses the whole run otherwise), so this document is left out of
# iris.system.dsc.yaml, which keeps its `test` unelevated. `just system` sets it on its
# own, elevated, through dsc/iris.restart.dsc.yaml, before anything installs. Check it with `just dsc config test`
# from an elevated shell. The built-in resource has no `test` of its own, so DSC works that out from `get`, which can't
# report a restart, and its per-feature `restartRequired` says `Possible` whether or not the feature is installed, so
# `just system` learns of the restart only from the machine after applying this (docs/install.md).
# Enabling a feature needs a restart, which leaves RebootPending set, so `just system` restarts once before any
# installer runs, and `just install` continues after it.
# Virtual Machine Platform is also enabled by `wsl --install` (Winfiles/Wsl); it's listed
# here so every feature winfiles relies on is declared in this file.
resources:
  - type: Microsoft.Windows/OptionalFeatureList
    name: Optional Features
    properties:
      features:
        # WSL 2
        - featureName: VirtualMachinePlatform
          state: Installed
        # Hyper-V, to host the test VMs (scripts/New-TestVm.ps1). Not available on Windows Home.
        # DISM doesn't enable a feature's children along with it, so each one is listed, parents first
        - featureName: Microsoft-Hyper-V-All
          state: Installed
        - featureName: Microsoft-Hyper-V
          state: Installed
        - featureName: Microsoft-Hyper-V-Hypervisor
          state: Installed
        - featureName: Microsoft-Hyper-V-Services
          state: Installed
        - featureName: Microsoft-Hyper-V-Tools-All
          state: Installed
        - featureName: Microsoft-Hyper-V-Management-Clients
          state: Installed
        - featureName: Microsoft-Hyper-V-Management-PowerShell
          state: Installed
    metadata:
      description: Enable Virtual Machine Platform and Hyper-V
