$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The Windows optional features iris uses. Microsoft.Windows/OptionalFeatureList needs an elevated
# shell even for `get` (DSC refuses the whole run otherwise), so it needs one to run on its own too:
# `just dsc config test --file dsc/hosts/iris/features.dsc.yaml` from an elevated shell. iris.system.dsc.yaml
# includes it, and everything in that is elevated. The built-in resource has no `test` of its own, so DSC works
# that out from `get`, which can't report a restart, and its per-feature `restartRequired` says `Possible` whether
# or not the feature is installed, so Invoke-Configuration.ps1 doesn't learn of the restart from this resource. The
# WSL resource, which depends on it, does report one, so both are applied first; a feature that changes without WSL
# is found from the machine after its batch (docs/run/restarts.md).
# Enabling a feature needs a restart, which leaves RebootPending set, so the run restarts once before any
# installer runs, and `just install` continues after it.
# Virtual Machine Platform is also enabled by `wsl --install` (Winfiles.Wsl/Wsl); it's listed
# here so every feature winfiles relies on is declared in this file.
resources:
  - type: Microsoft.Windows/OptionalFeatureList
    name: Optional Features
    properties:
      features:
        # WSL 2
        - featureName: VirtualMachinePlatform
          state: Installed
        # Hyper-V, to host the test VMs (scripts/New-TestVm.ps1). Not available on Windows Home.
        # DISM doesn't enable a feature's children along with it, so each one is listed, parents first
        - featureName: Microsoft-Hyper-V-All
          state: Installed
        - featureName: Microsoft-Hyper-V
          state: Installed
        - featureName: Microsoft-Hyper-V-Hypervisor
          state: Installed
        - featureName: Microsoft-Hyper-V-Services
          state: Installed
        - featureName: Microsoft-Hyper-V-Tools-All
          state: Installed
        - featureName: Microsoft-Hyper-V-Management-Clients
          state: Installed
        - featureName: Microsoft-Hyper-V-Management-PowerShell
          state: Installed
    metadata:
      description: Enable Virtual Machine Platform and Hyper-V
