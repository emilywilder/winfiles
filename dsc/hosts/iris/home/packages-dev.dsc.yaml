  # Scoop apps. Languages and their package managers
  - type: Winfiles.Scoop/Package
    name: nodejs
    properties:
      name: nodejs
    metadata:
      description: Install Node.js

  - type: Winfiles.Scoop/Package
    name: python
    properties:
      name: python
    metadata:
      description: Install Python

  - type: Winfiles.Scoop/Package
    name: uv
    properties:
      name: uv
    metadata:
      description: Install uv

  # Task runner and linters
