$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user document and notes tools. The office suite and LaTeX editor are in
# hosts/iris/system/packages-productivity.dsc.yaml.
resources:
  # Document viewers
  - type: Winfiles.WinGet/Package
    name: SumatraPDF.SumatraPDF
    properties:
      id: SumatraPDF.SumatraPDF
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install SumatraPDF

  # Notes and Markdown editors
  - type: Winfiles.WinGet/Package
    name: Obsidian.Obsidian
    properties:
      id: Obsidian.Obsidian
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Obsidian

  - type: Winfiles.WinGet/Package
    name: Zettlr.Zettlr
    properties:
      id: Zettlr.Zettlr
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Zettlr

  - type: Winfiles.WinGet/Package
    name: MarkText.MarkText
    properties:
      id: MarkText.MarkText
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install MarkText

  # TeX engine, from Scoop
  - type: Winfiles.Scoop/Package
    name: tectonic
    properties:
      name: tectonic
    metadata:
      description: Install Tectonic
