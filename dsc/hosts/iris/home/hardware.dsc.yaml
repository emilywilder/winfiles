$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Per-user software for iris's hardware.
resources:
  # RGB peripheral software. ChromaControl declares UI.Xaml 2.6, which `winget install --scope user` installs with
  # it (surveys/winget-paths, 2026-11-17). Install-WinGetPackage didn't (0x8A150110), so the old list named it
  # first.
  - type: Winfiles.WinGet/Package
    name: AndrewAlanBabbitt.ChromaControl
    properties:
      id: AndrewAlanBabbitt.ChromaControl
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Chroma Control

  # USB devices and driver updates
  - type: Winfiles.WinGet/Package
    name: NirSoft.USBLogView
    properties:
      id: NirSoft.USBLogView
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install USBLogView

  - type: Winfiles.WinGet/Package
    name: GlennDelahoy.SnappyDriverInstallerOrigin
    properties:
      id: GlennDelahoy.SnappyDriverInstallerOrigin
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Snappy Driver Installer Origin

  # Scoop apps. Display driver removal and fan curves
  - type: Winfiles.Scoop/Package
    name: ddu
    properties:
      name: ddu
    metadata:
      description: Install Display Driver Uninstaller

  - type: Winfiles.Scoop/Package
    name: fancontrol
    properties:
      name: fancontrol
    metadata:
      description: Install FanControl
