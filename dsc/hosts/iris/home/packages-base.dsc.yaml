$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# iris's per-user base tools. Machine-wide ones are in hosts/iris/system/packages-base.dsc.yaml.
# `_scope: User` makes winget pick a per-user installer, so an unelevated run raises no UAC prompt. A package
# with no such installer fails instead, and belongs in the matching hosts/iris/system document. It's
# Winfiles.WinGet/Package's stop-gap for a scope Microsoft.WinGet/Package lacks (docs/config/winget.md, "Drift from
# upstream").
resources:
  # Terminal and package tools
  - type: Winfiles.WinGet/Package
    name: Microsoft.WindowsTerminal
    properties:
      id: Microsoft.WindowsTerminal
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Windows Terminal

  - type: Winfiles.WinGet/Package
    name: Microsoft.AppInstaller
    properties:
      id: Microsoft.AppInstaller
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install App Installer (winget)

  - type: Winfiles.WinGet/Package
    name: jdx.mise
    properties:
      id: jdx.mise
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install mise

  # Password management
  - type: Winfiles.WinGet/Package
    name: AgileBits.1Password
    properties:
      id: AgileBits.1Password
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install 1Password

  - type: Winfiles.WinGet/Package
    name: AgileBits.1Password.CLI
    properties:
      id: AgileBits.1Password.CLI
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the 1Password CLI

  # Cloud storage
  - type: Winfiles.WinGet/Package
    name: Microsoft.OneDrive
    properties:
      id: Microsoft.OneDrive
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install OneDrive

  # System utilities and boot media
  - type: Winfiles.WinGet/Package
    name: Microsoft.Sysinternals.Autoruns
    properties:
      id: Microsoft.Sysinternals.Autoruns
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Autoruns

  - type: Winfiles.WinGet/Package
    name: Microsoft.PowerToys
    properties:
      id: Microsoft.PowerToys
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install PowerToys

  - type: Winfiles.WinGet/Package
    name: Rufus.Rufus
    properties:
      id: Rufus.Rufus
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Rufus

  # Scoop apps. Searching Scoop's buckets
  - type: Winfiles.Scoop/Package
    name: scoop-search
    properties:
      name: scoop-search
    metadata:
      description: Install scoop-search

  # History, navigation and environment
  - type: Winfiles.Scoop/Package
    name: atuin
    properties:
      name: atuin
    metadata:
      description: Install Atuin

  - type: Winfiles.Scoop/Package
    name: fzf
    properties:
      name: fzf
    metadata:
      description: Install fzf

  - type: Winfiles.Scoop/Package
    name: direnv
    properties:
      name: direnv
    metadata:
      description: Install direnv

  - type: Winfiles.Scoop/Package
    name: psmux
    properties:
      name: psmux
    metadata:
      description: Install psmux

  # Viewing and searching files
  - type: Winfiles.Scoop/Package
    name: bat
    properties:
      name: bat
    metadata:
      description: Install bat

  - type: Winfiles.Scoop/Package
    name: eza
    properties:
      name: eza
    metadata:
      description: Install eza

  - type: Winfiles.Scoop/Package
    name: glow
    properties:
      name: glow
    metadata:
      description: Install Glow

  - type: Winfiles.Scoop/Package
    name: less
    properties:
      name: less
    metadata:
      description: Install less

  - type: Winfiles.Scoop/Package
    name: ripgrep
    properties:
      name: ripgrep
    metadata:
      description: Install ripgrep

  # Editor
  - type: Winfiles.Scoop/Package
    name: neovim
    properties:
      name: neovim
    metadata:
      description: Install Neovim

  # Ports of Unix command-line tools
  - type: Winfiles.Scoop/Package
    name: microsoft-coreutils
    properties:
      name: microsoft-coreutils
    metadata:
      description: Install Microsoft's port of the coreutils

  - type: Winfiles.Scoop/Package
    name: diffutils
    properties:
      name: diffutils
    metadata:
      description: Install GNU diffutils

  - type: Winfiles.Scoop/Package
    name: sed
    properties:
      name: sed
    metadata:
      description: Install GNU sed

  - type: Winfiles.Scoop/Package
    name: file
    properties:
      name: file
    metadata:
      description: Install file

  - type: Winfiles.Scoop/Package
    name: dos2unix
    properties:
      name: dos2unix
    metadata:
      description: Install dos2unix

  - type: Winfiles.Scoop/Package
    name: xz
    properties:
      name: xz
    metadata:
      description: Install xz

  - type: Winfiles.Scoop/Package
    name: util-linux-ng
    properties:
      name: util-linux-ng
    metadata:
      description: Install util-linux-ng

  # Terminal font with Nerd Font symbols (Windows Terminal uses MesloLGM Nerd Font). Installed per
  # user, into %LOCALAPPDATA%\Microsoft\Windows\Fonts. Each manifest copies one variant from the
  # ryanoasis/nerd-fonts release: normal, Mono (single-width symbols) and Propo (proportional)
  - type: Winfiles.Scoop/Package
    name: Meslo-NF
    properties:
      name: Meslo-NF
      bucket: nerd-fonts
    metadata:
      description: Install the Meslo Nerd Font

  - type: Winfiles.Scoop/Package
    name: Meslo-NF-Mono
    properties:
      name: Meslo-NF-Mono
      bucket: nerd-fonts
    metadata:
      description: Install the Meslo Nerd Font, Mono

  - type: Winfiles.Scoop/Package
    name: Meslo-NF-Propo
    properties:
      name: Meslo-NF-Propo
      bucket: nerd-fonts
    metadata:
      description: Install the Meslo Nerd Font, Propo

  - type: Winfiles.Scoop/Package
    name: GeistMono-NF
    properties:
      name: GeistMono-NF
      bucket: nerd-fonts
    metadata:
      description: Install the Geist Mono Nerd Font

  - type: Winfiles.Scoop/Package
    name: GeistMono-NF-Mono
    properties:
      name: GeistMono-NF-Mono
      bucket: nerd-fonts
    metadata:
      description: Install the Geist Mono Nerd Font, Mono

  - type: Winfiles.Scoop/Package
    name: GeistMono-NF-Propo
    properties:
      name: GeistMono-NF-Propo
      bucket: nerd-fonts
    metadata:
      description: Install the Geist Mono Nerd Font, Propo
