$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user creative tools. Players and image processing are in hosts/iris/system/packages-media.dsc.yaml.
resources:
  # Graphics and streaming
  - type: Winfiles.WinGet/Package
    name: Canva.Affinity
    properties:
      id: Canva.Affinity
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Affinity

  - type: Winfiles.WinGet/Package
    name: MeldStudio.MeldStudio
    properties:
      id: MeldStudio.MeldStudio
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install Meld Studio
