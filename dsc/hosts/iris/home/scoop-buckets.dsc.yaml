$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The Scoop buckets iris uses. Adding a bucket other than main needs git, which dsc/modules/home/scoop.dsc.yaml
# installs, so the home entry includes this after that module (dependsOn on its Scoop Include), and the package
# documents that use a bucket after this. On its own, run it once Scoop and git are installed.
parameters:
  scoopBuckets:
    type: object
    defaultValue:
      main: https://github.com/ScoopInstaller/Main.git
      extras: https://github.com/ScoopInstaller/Extras
      nerd-fonts: https://github.com/matthewjberger/scoop-nerd-fonts
    metadata:
      description: Scoop buckets as name and repository URL; each has a Winfiles.Scoop/Bucket below

resources:
  - type: Winfiles.Scoop/Bucket
    name: main
    properties:
      name: main
      source: "[parameters('scoopBuckets')['main']]"
    metadata:
      description: Add the main bucket (Scoop's installer adds it too)

  - type: Winfiles.Scoop/Bucket
    name: extras
    properties:
      name: extras
      source: "[parameters('scoopBuckets')['extras']]"
    metadata:
      description: Add the extras bucket

  - type: Winfiles.Scoop/Bucket
    name: nerd-fonts
    properties:
      name: nerd-fonts
      source: "[parameters('scoopBuckets')['nerd-fonts']]"
    metadata:
      description: Add the nerd-fonts bucket
