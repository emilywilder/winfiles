$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Machine-wide Windows settings only iris wants. Writing under HKLM needs an elevated shell.
parameters:
  terminalServerKeyPath:
    type: string
    defaultValue: 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server'
    metadata:
      description: Registry key holding the Remote Desktop settings
  rdpListenerKeyPath:
    type: string
    defaultValue: 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    metadata:
      description: Registry key holding the settings of Remote Desktop's listener

resources:
  # No metadata.description: DSC passes it to the resource as _metadata, which RegistryList counts as
  # a difference, so test would always report false
  - type: Microsoft.Windows/RegistryList
    name: Host Settings
    properties:
      registryEntries:
        # Allow Remote Desktop connections. Only here, not in a module: the test VM's administrator has a
        # blank password
        - keyPath: "[parameters('terminalServerKeyPath')]"
          valueName: fDenyTSConnections
          valueData:
            DWord: 0
        # Require Network Level Authentication, so a connection authenticates before a session starts
        - keyPath: "[parameters('rdpListenerKeyPath')]"
          valueName: UserAuthentication
          valueData:
            DWord: 1

  # Reach Remote Desktop from Private networks only. These rules ship with Windows, so this only enables
  # them and limits their profiles. The resource finds a rule by its display name, which is localized, not
  # by Get-NetFirewallRule's Name, and reports any other name as missing. No metadata.description, as above
  - type: Microsoft.Windows/FirewallRuleList
    name: Remote Desktop Firewall
    properties:
      rules:
        - name: Remote Desktop - User Mode (TCP-In)
          enabled: true
          profiles:
            - Private
        - name: Remote Desktop - User Mode (UDP-In)
          enabled: true
          profiles:
            - Private
        - name: Remote Desktop - Shadow (TCP-In)
          enabled: true
          profiles:
            - Private
        # Remote Desktop over a secure WebSocket, on TCP 3392. Listed so `test` reports it if it's enabled,
        # since it applies to every profile and would get around the Private limit above
        - name: Remote Desktop - (TCP-WSS-In)
          enabled: false
