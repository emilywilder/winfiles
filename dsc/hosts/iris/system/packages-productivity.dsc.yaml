$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Office and LaTeX tools with only a machine-wide installer. The rest are in
# hosts/iris/home/packages-productivity.dsc.yaml.
# Left out: LyX.LyX, installed by hand. See dsc/hosts/<host>/manual.yaml
resources:
  - type: Microsoft.WinGet/Package
    name: TheDocumentFoundation.LibreOffice
    properties:
      id: TheDocumentFoundation.LibreOffice
      source: winget
      acceptAgreements: true
    metadata:
      description: Install LibreOffice

  - type: Microsoft.WinGet/Package
    name: TeXstudio.TeXstudio
    properties:
      id: TeXstudio.TeXstudio
      source: winget
      acceptAgreements: true
    metadata:
      description: Install TeXstudio
