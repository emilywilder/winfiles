$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Runtimes that apps depend on. Runtimes that only games use are in packages-gaming.dsc.yaml. MSIX frameworks (VCLibs,
# UI.Xaml,
# .NET Native, Windows App Runtime) aren't listed: the image and the Store supply most of them, and winget installs
# a declared dependency with the app (docs/config/packages.md).
# Removing a resource doesn't uninstall its package: set `_exist: false` and run `winfiles.ps1 system` first.
resources:
  # Microsoft Visual C++ redistributables
  - type: Microsoft.WinGet/Package
    name: Microsoft.VCRedist.2005.x86
    properties:
      id: Microsoft.VCRedist.2005.x86
      source: winget
      acceptAgreements: true
    metadata:
      description: Install the Visual C++ 2005 redistributable (x86)

  - type: Microsoft.WinGet/Package
    name: Microsoft.VCRedist.2005.x64
    properties:
      id: Microsoft.VCRedist.2005.x64
      source: winget
      acceptAgreements: true
    metadata:
      description: Install the Visual C++ 2005 redistributable (x64)

  - type: Microsoft.WinGet/Package
    name: Microsoft.VCRedist.2008.x86
    properties:
