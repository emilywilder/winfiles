$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Machine-wide software for iris's hardware (Ryzen 9 7900X, RX 6950 XT, ASUS board, Corsair devices).
# Left out: Corsair.iCUE.5, installed by hand. See manual.yaml
resources:
  # Hardware information
  - type: Microsoft.WinGet/Package
    name: CPUID.CPU-Z
    properties:
      id: CPUID.CPU-Z
      source: winget
      acceptAgreements: true
    metadata:
      description: Install CPU-Z

  - type: Microsoft.WinGet/Package
    name: TechPowerUp.GPU-Z
    properties:
      id: TechPowerUp.GPU-Z
      source: winget
      acceptAgreements: true
    metadata:
      description: Install GPU-Z

  # Controller software
  - type: Microsoft.WinGet/Package
    name: PlayStation.PlayStationAccessories
    properties:
      id: PlayStation.PlayStationAccessories
      source: winget
      acceptAgreements: true
    metadata:
      description: Install PlayStation Accessories
