$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# iris's machine-wide base tools. Per-user ones are in hosts/iris/home/packages-base.dsc.yaml.
resources:
  - type: Microsoft.WinGet/Package
    name: gerardog.gsudo
    properties:
      id: gerardog.gsudo
      source: winget
      acceptAgreements: true
    metadata:
      description: Install gsudo

  # Archives and disk usage
  - type: Microsoft.WinGet/Package
    name: Giorgiotani.Peazip
    properties:
      id: Giorgiotani.Peazip
      source: winget
      acceptAgreements: true
    metadata:
      description: Install PeaZip

  - type: Microsoft.WinGet/Package
    name: WinDirStat.WinDirStat
    properties:
      id: WinDirStat.WinDirStat
      source: winget
      acceptAgreements: true
    metadata:
      description: Install WinDirStat

  # Malware protection
  - type: Microsoft.WinGet/Package
    name: Malwarebytes.Malwarebytes
    properties:
      id: Malwarebytes.Malwarebytes
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Malwarebytes
