$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Development tools with only a machine-wide installer. The rest are in hosts/iris/home/packages-dev.dsc.yaml.
resources:
  - type: Microsoft.WinGet/Package
    name: GNU.Emacs
    properties:
      id: GNU.Emacs
      source: winget
      acceptAgreements: true
    metadata:
      description: Install GNU Emacs

  - type: Microsoft.WinGet/Package
    name: RProject.R
    properties:
      id: RProject.R
      source: winget
      acceptAgreements: true
    metadata:
      description: Install R
