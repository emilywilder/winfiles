$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Media tools with only a machine-wide installer, or a better one than the per-user alternative. The rest
# are in hosts/iris/home/packages-media.dsc.yaml.
resources:
  # Audio and video players
  - type: Microsoft.WinGet/Package
    name: VideoLAN.VLC
    properties:
      id: VideoLAN.VLC
      source: winget
      acceptAgreements: true
    metadata:
      description: Install VLC

  - type: Microsoft.WinGet/Package
    name: PeterPawlowski.foobar2000
    properties:
      id: PeterPawlowski.foobar2000
      source: winget
      acceptAgreements: true
    metadata:
      description: Install foobar2000

  # Image processing
  - type: Microsoft.WinGet/Package
    name: ImageMagick.ImageMagick
    properties:
      id: ImageMagick.ImageMagick
      source: winget
      acceptAgreements: true
    metadata:
      description: Install ImageMagick
