$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Browsers, mail and networking tools that need elevation to install. The rest are in
# hosts/iris/home/packages-internet.dsc.yaml.
resources:
  # Web browsers (their policies are in policies.dsc.yaml)
  - type: Microsoft.WinGet/Package
    name: Mozilla.Firefox
    properties:
      id: Mozilla.Firefox
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Firefox

  - type: Microsoft.WinGet/Package
    name: Microsoft.Edge
    properties:
      id: Microsoft.Edge
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Microsoft Edge

  # Mail
  - type: Microsoft.WinGet/Package
    name: Mozilla.Thunderbird
    properties:
      id: Mozilla.Thunderbird
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Thunderbird

  - type: Microsoft.WinGet/Package
    name: Proton.ProtonMailBridge
    properties:
      id: Proton.ProtonMailBridge
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Proton Mail Bridge

  # Networking and VPN
  - type: Microsoft.WinGet/Package
    name: Proton.ProtonVPN
    properties:
      id: Proton.ProtonVPN
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Proton VPN

  - type: Microsoft.WinGet/Package
    name: WiresharkFoundation.Wireshark
    properties:
      id: WiresharkFoundation.Wireshark
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Wireshark

  # Its manifest offers a per-user installer, but that asks for UAC anyway, which would stop an unelevated run
  - type: Microsoft.WinGet/Package
    name: KDE.KDEConnect
    properties:
      id: KDE.KDEConnect
      source: winget
      acceptAgreements: true
    metadata:
      description: Install KDE Connect
