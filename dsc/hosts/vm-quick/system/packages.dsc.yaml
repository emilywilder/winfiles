$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Machine-wide packages of the quick test host, in place of iris's package lists (hosts/iris/system): one package
# that Windows ships (Edge; winget lists it on a fresh image, checked in the test VM 2026-11-15), so `set` takes
# its "already installed" path without relying on the bootstrap, and one small MSI from
# hosts/iris/system/packages-base.dsc.yaml that it has to install.
# post-install: vm-quick runs every step of `winfiles.ps1 switch` and every kind of resource, with a few small
# packages in place of iris's package lists and Alpine in place of NixOS-WSL. Before relying on a change to a
# package list or to NixOS-WSL, run the full install in a test VM: `.\install.cmd vm`.
resources:
  - type: Microsoft.WinGet/Package
    name: Microsoft.Edge
    properties:
      id: Microsoft.Edge
      source: winget
      acceptAgreements: true
    metadata:
      description: Install Microsoft Edge

  - type: Microsoft.WinGet/Package
    name: WinDirStat.WinDirStat
    properties:
      id: WinDirStat.WinDirStat
      source: winget
      acceptAgreements: true
    metadata:
      description: Install WinDirStat
