$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The Windows optional features of the quick test host: the same as hosts/vm/system/features.dsc.yaml, only what
# WSL 2 needs. Microsoft.Windows/OptionalFeatureList needs an elevated shell even for `get`, so it needs an
# elevated shell to run on its own. vm-quick.system.dsc.yaml includes it, and everything in that is elevated.
resources:
  - type: Microsoft.Windows/OptionalFeatureList
    name: Optional Features
    properties:
      features:
        - featureName: VirtualMachinePlatform
          state: Installed
    metadata:
      description: Enable Virtual Machine Platform
