$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The Windows optional features of the quick test host: the same as hosts/vm/features.dsc.yaml, only what WSL 2 needs.
# Microsoft.Windows/OptionalFeatureList needs an elevated shell even for `get`, so this document is left out of
# vm-quick.system.dsc.yaml, and `just system` sets it on its own (dsc/vm-quick.restart.dsc.yaml).
resources:
  - type: Microsoft.Windows/OptionalFeatureList
    name: Optional Features
    properties:
      features:
        - featureName: VirtualMachinePlatform
          state: Installed
    metadata:
      description: Enable Virtual Machine Platform
