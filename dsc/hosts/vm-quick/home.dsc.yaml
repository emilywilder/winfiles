$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user packages of the quick test host, in place of the shared modules/home package documents: gh, which needs
# _scope: User (without a scope winget picks its machine-wide MSI, a UAC prompt in this unelevated run;
# surveys/winget-paths, 2026-11-17), and two small Scoop apps, one from main by bare name and one as bucket/name from a bucket that
# modules/home/scoop-core.dsc.yaml adds.
resources:
  - type: Winfiles.WinGet/Package
    name: GitHub.cli
    properties:
      id: GitHub.cli
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the GitHub CLI

  - type: Winfiles/ScoopPackageList
    name: Quick Scoop Apps
    properties:
      packages:
        - jq
        - extras/everything
    metadata:
      description: Ensure an app from the main bucket and one from extras are installed
