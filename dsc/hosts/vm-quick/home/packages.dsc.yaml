$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Per-user packages of the quick test host, in place of iris's package documents (hosts/iris/home): gh, which needs
# _scope: User (without a scope winget picks its machine-wide MSI, a UAC prompt in this unelevated run;
# surveys/winget-paths, 2026-11-17), and one Scoop app from a bucket, as bucket/name, that
# hosts/vm-quick/home/scoop-buckets.dsc.yaml adds.
resources:
  - type: Winfiles.WinGet/Package
    name: GitHub.cli
    properties:
      id: GitHub.cli
      source: winget
      acceptAgreements: true
      _scope: User
    metadata:
      description: Install the GitHub CLI

  # A Scoop app with a bucket (the bare-name, main-bucket kind is every app in dsc/modules/home/scoop.dsc.yaml)
  - type: Winfiles.Scoop/Package
    name: everything
    properties:
      name: everything
      bucket: extras
    metadata:
      description: Install Everything, from the extras bucket
