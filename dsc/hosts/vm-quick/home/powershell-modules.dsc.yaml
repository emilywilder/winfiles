$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# The PowerShell modules the quick test host installs for its user, from PSGallery: only PSDscResources, which
# iris's list (dsc/hosts/iris/home/powershell-modules.dsc.yaml) also has, to take the install path in a quick
# run. The rest is as in iris's: the home entry includes this after dsc/modules/home/powershell.dsc.yaml, and the
# modules go into Documents\PowerShell\Modules, the junction to that module's modulePath.
resources:
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: PowerShell Modules
    properties:
      input:
        repository: PSGallery
        modules:
          - PSDscResources
      getScript: |
        param($Settings)
        $path = Join-Path -Path ([Environment]::GetFolderPath('MyDocuments')) -ChildPath 'PowerShell\Modules'
        $Settings.modules | ForEach-Object -Process {
            [pscustomobject]@{
                Name      = $_
                Installed = Test-Path -Path (Join-Path -Path $path -ChildPath "$_\*\$_.psd1")
            }
        }
      testScript: |
        param($Settings)
        $path = Join-Path -Path ([Environment]::GetFolderPath('MyDocuments')) -ChildPath 'PowerShell\Modules'
        -not ($Settings.modules | Where-Object -FilterScript {
                -not (Test-Path -Path (Join-Path -Path $path -ChildPath "$_\*\$_.psd1"))
            })
      setScript: |
        param($Settings)
        $path = Join-Path -Path ([Environment]::GetFolderPath('MyDocuments')) -ChildPath 'PowerShell\Modules'
        $missing = $Settings.modules | Where-Object -FilterScript {
            -not (Test-Path -Path (Join-Path -Path $path -ChildPath "$_\*\$_.psd1"))
        }
        if ($missing) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            # -IncludeXml: without PSGetModuleInfo.xml, Get-PSResource doesn't list the module
            $save = @{
                Name            = $missing
                Path            = $path
                Repository      = $Settings.repository
                TrustRepository = $true
                IncludeXml      = $true
                Quiet           = $true
            }
            Save-PSResource @save
        }
    metadata:
      description: Install PowerShell modules into the user's module folder
