$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

# Gives this computer the name of its host, so just picks the same configuration after the restart as
# install.cmd vm-quick did. Needs elevation. Windows applies a rename at the next restart, and the resource says so
# when it sets one. The state counts as reached only once the restart has made the new name live, so `just check`
# fails until then; `just system` applies this before the restart it makes anyway (dsc/vm-quick.restart.dsc.yaml).
resources:
  - type: Winfiles/ComputerName
    name: Computer Name
    properties:
      name: vm-quick
    metadata:
      description: Name the computer vm-quick
