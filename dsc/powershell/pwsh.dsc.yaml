$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json

metadata:
  winget:
    processor:
      identifier: dscv3

parameters:
  modulePath:
    type: string
    defaultValue: '%USERPROFILE%/.local/share/powershell/Modules'
    metadata:
      description: User module path for PowerShell 7 (environment variables are expanded at runtime)
  scriptPath:
    type: string
    defaultValue: '%USERPROFILE%/.local/share/powershell/Scripts'
    metadata:
      description: User script path for PowerShell 7 (environment variables are expanded at runtime)

resources:
  - type: Microsoft.WinGet/Package
    name: PowerShell
    properties:
      id: Microsoft.PowerShell
      source: winget
      useLatest: true
    metadata:
      description: Install PowerShell 7

  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: PowerShell Module Path
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package', 'PowerShell')]"
    properties:
      input: "[parameters('modulePath')]"
      getScript: |
        param($ModulePath)
        $configFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\powershell.config.json'
        if (Test-Path $configFile) { (Get-Content $configFile -Raw | ConvertFrom-Json).PSModulePath }
      testScript: |
        param($ModulePath)
        $configFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\powershell.config.json'
        $config = if (Test-Path $configFile) { Get-Content $configFile -Raw | ConvertFrom-Json }
        ($config.PSModulePath -eq $ModulePath) -and (Test-Path ([Environment]::ExpandEnvironmentVariables($ModulePath)))
      setScript: |
        param($ModulePath)
        $configFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\powershell.config.json'
        $config = if (Test-Path $configFile) { Get-Content $configFile -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
        $config['PSModulePath'] = $ModulePath
        New-Item -ItemType Directory -Force -Path (Split-Path $configFile) | Out-Null
        $config | ConvertTo-Json | Set-Content -Path $configFile
        New-Item -ItemType Directory -Force -Path ([Environment]::ExpandEnvironmentVariables($ModulePath)) | Out-Null
    metadata:
      description: Set a custom user module path for PowerShell 7

  # Install-Module/Install-Script/Install-PSResource -Scope CurrentUser always install to
  # Documents\PowerShell\{Modules,Scripts} (ignoring PSModulePath), so those folders are replaced
  # with junctions to modulePath/scriptPath. Existing contents are moved over first: each item is
  # moved whole unless the target already has it, in which case its children are moved one by one
  # (e.g. a module's versions, or InstalledScriptInfos entries). Anything that clashes is kept in a
  # <folder>.<timestamp>.bak folder.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Junction Default Install Folders
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript', 'PowerShell Module Path')]"
    properties:
      input:
        - folder: Modules
          target: "[parameters('modulePath')]"
        - folder: Scripts
          target: "[parameters('scriptPath')]"
      getScript: |
        param($Junctions)
        foreach ($junction in $Junctions) {
            $link = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "PowerShell\$($junction.folder)"
            Get-Item $link -Force -ErrorAction Ignore | Select-Object FullName, LinkType, Target
        }
      testScript: |
        param($Junctions)
        -not ($Junctions | Where-Object {
            $link = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "PowerShell\$($_.folder)"
            $target = [IO.Path]::GetFullPath([Environment]::ExpandEnvironmentVariables($_.target)).TrimEnd('\')
            $item = Get-Item $link -Force -ErrorAction Ignore
            -not (($item.LinkType -eq 'Junction') -and ("$($item.Target)".TrimEnd('\') -eq $target))
        })
      setScript: |
        param($Junctions)
        function Move-Missing($From, $To, $Depth) {
            foreach ($item in Get-ChildItem $From -Force) {
                $dest = Join-Path $To $item.Name
                if (-not (Test-Path $dest)) { Move-Item $item.FullName $dest }
                elseif ($item.PSIsContainer -and $Depth -gt 0) { Move-Missing $item.FullName $dest ($Depth - 1) }
            }
        }
        foreach ($junction in $Junctions) {
            $link = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "PowerShell\$($junction.folder)"
            $target = [IO.Path]::GetFullPath([Environment]::ExpandEnvironmentVariables($junction.target)).TrimEnd('\')
            $item = Get-Item $link -Force -ErrorAction Ignore
            if (($item.LinkType -eq 'Junction') -and ("$($item.Target)".TrimEnd('\') -eq $target)) { continue }
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            if ($item.LinkType) {
                # an existing link pointing elsewhere: remove only the link, never its target's contents
                [IO.Directory]::Delete($item.FullName)
            }
            elseif ($item) {
                Move-Missing $link $target 1
                if (Get-ChildItem $link -Recurse -File -Force) {
                    Rename-Item $link "$($junction.folder).$(Get-Date -Format yyyyMMddHHmmss).bak"
                }
                else {
                    Remove-Item $link -Recurse -Force
                }
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $link) | Out-Null
            New-Item -ItemType Junction -Path $link -Target $target | Out-Null
        }
    metadata:
      description: Point the default CurrentUser Modules and Scripts folders at modulePath and scriptPath

  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Trust PSGallery Repository
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package', 'PowerShell')]"
    properties:
      input: PSGallery
      getScript: |
        param($Repository)
        Get-PSResourceRepository -Name $Repository | Select-Object Name, Trusted
      testScript: |
        param($Repository)
        [bool](Get-PSResourceRepository -Name $Repository).Trusted
      setScript: |
        param($Repository)
        Set-PSResourceRepository -Name $Repository -Trusted
    metadata:
      description: Trust the PSGallery repository

  # Microsoft.PowerShell.PSResourceGet/PSResourceList only installs to the fixed CurrentUser
  # scope (Documents\PowerShell\Modules), so modules are saved into modulePath instead.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: PowerShell Modules
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript', 'PowerShell Module Path')]"
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript', 'Trust PSGallery Repository')]"
    properties:
      input:
        modulePath: "[parameters('modulePath')]"
        repository: PSGallery
        modules:
          - Microsoft.WinGet.Client
          - PSDscResources
          - PSFzf
          - PSWindowsUpdate
      getScript: |
        param($Settings)
        $path = [Environment]::ExpandEnvironmentVariables($Settings.modulePath)
        $Settings.modules | ForEach-Object {
            [pscustomobject]@{ Name = $_; Installed = Test-Path (Join-Path $path "$_\*\$_.psd1") }
        }
      testScript: |
        param($Settings)
        $path = [Environment]::ExpandEnvironmentVariables($Settings.modulePath)
        -not ($Settings.modules | Where-Object { -not (Test-Path (Join-Path $path "$_\*\$_.psd1")) })
      setScript: |
        param($Settings)
        $path = [Environment]::ExpandEnvironmentVariables($Settings.modulePath)
        $missing = $Settings.modules | Where-Object { -not (Test-Path (Join-Path $path "$_\*\$_.psd1")) }
        if ($missing) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            Save-PSResource -Name $missing -Path $path -Repository $Settings.repository -TrustRepository -Quiet
        }
    metadata:
      description: Install PowerShell modules into the custom module path

  - type: Microsoft.WinGet/Package
    name: Oh My Posh
    properties:
      id: JanDeDobbeleer.OhMyPosh
      source: winget
    metadata:
      description: Install oh-my-posh (prompt used by the PowerShell profile)

  # PowerShell can't relocate $PROFILE, so the default CurrentUserCurrentHost profile
  # becomes a stub that repoints $PROFILE and dot-sources the custom location.
  # (Microsoft.PowerShell/Profile isn't used: in DSC 3.2.3 its get breaks on non-empty profiles.)
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Redirect CurrentUserCurrentHost Profile
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package', 'PowerShell')]"
    properties:
      input: |
        # Managed by winfiles (dsc/powershell/pwsh.dsc.yaml): redirect $PROFILE to ~/.config/powershell
        $PROFILE = & {
            $profileDir = Join-Path $HOME '.config/powershell'
            $currentUserCurrentHost = Join-Path $profileDir 'Microsoft.PowerShell_profile.ps1'
            $currentUserCurrentHost | Add-Member -PassThru -NotePropertyMembers ([ordered]@{
                AllUsersAllHosts       = $PROFILE.AllUsersAllHosts
                AllUsersCurrentHost    = $PROFILE.AllUsersCurrentHost
                CurrentUserAllHosts    = Join-Path $profileDir 'profile.ps1'
                CurrentUserCurrentHost = $currentUserCurrentHost
            })
        }
        if (Test-Path $PROFILE) { . $PROFILE }
      getScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Microsoft.PowerShell_profile.ps1'
        if (Test-Path $profileFile) { Get-Content $profileFile -Raw }
      testScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Microsoft.PowerShell_profile.ps1'
        (Test-Path $profileFile) -and ((Get-Content $profileFile -Raw) -eq $Stub)
      setScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Microsoft.PowerShell_profile.ps1'
        if (Test-Path $profileFile) {
            Copy-Item $profileFile "$profileFile.$(Get-Date -Format yyyyMMddHHmmss).bak"
        }
        New-Item -ItemType Directory -Force -Path (Split-Path $profileFile) | Out-Null
        Set-Content -Path $profileFile -Value $Stub -NoNewline
        New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.config/powershell') | Out-Null
    metadata:
      description: Point $PROFILE.CurrentUserCurrentHost at ~/.config/powershell

  # Same as above for the CurrentUserAllHosts profile, which runs before CurrentUserCurrentHost.
  # $PROFILE is repointed by the CurrentUserCurrentHost stub, so this stub only dot-sources.
  - type: Microsoft.DSC.Transitional/PowerShellScript
    name: Redirect CurrentUserAllHosts Profile
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package', 'PowerShell')]"
    properties:
      input: |
        # Managed by winfiles (dsc/powershell/pwsh.dsc.yaml): redirect $PROFILE.CurrentUserAllHosts to ~/.config/powershell
        if (Test-Path "$HOME/.config/powershell/profile.ps1") { . "$HOME/.config/powershell/profile.ps1" }
      getScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\profile.ps1'
        if (Test-Path $profileFile) { Get-Content $profileFile -Raw }
      testScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\profile.ps1'
        (Test-Path $profileFile) -and ((Get-Content $profileFile -Raw) -eq $Stub)
      setScript: |
        param($Stub)
        $profileFile = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\profile.ps1'
        if (Test-Path $profileFile) {
            Copy-Item $profileFile "$profileFile.$(Get-Date -Format yyyyMMddHHmmss).bak"
        }
        New-Item -ItemType Directory -Force -Path (Split-Path $profileFile) | Out-Null
        Set-Content -Path $profileFile -Value $Stub -NoNewline
    metadata:
      description: Point $PROFILE.CurrentUserAllHosts at ~/.config/powershell
