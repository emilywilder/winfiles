# Tools for working in this repo, provided by mise (https://mise.jdx.dev) per directory
# instead of being installed system-wide. On a clean Windows 11 install, the bootstrap
# (bootstrap.cmd) installs mise with winget, then runs `mise trust` and `mise install`;
# install.cmd then runs `just install` under mise exec
# mise.lock holds the exact version and checksum behind each request here, so `latest` only moves
# when `mise lock --bump` is run. After changing a request, run `mise lock` too
# Runs only use this file: scripts/Invoke-Clean.ps1 ignores any other mise configuration, with a warning

# The mise winfiles was last checked with. Neither the bootstrap (which skips an installed mise) nor the
# home configuration's winget list upgrades it, so an older one stops here with `winget upgrade jdx.mise`
min_version = "2026.11.2"

[tools]
just = "latest"
# DSC needs pwsh before dsc/modules/system/powershell.dsc.yaml installs it: scripts/Invoke-Dsc.ps1 runs
# under it, and PowerShellScript and the Winfiles/* resources are only discovered when
# tryWhich('pwsh') finds it
powershell = "latest"
# Elevates `just install`'s dsc config set in the same console, so its output and exit code stay there
gsudo = "latest"
# PowerShell has no YAML parser: reads and writes the documents for scripts/ConvertTo-FlatConfiguration.ps1 (`just
# system` and `just home`), and reads dsc/hosts/<host>/manual.yaml for `just manual`
yq = "latest"
# Renders Markdown files in the terminal, allowing README.md files to be better formatted.
glow = "latest"

# DSC v3, pinned because docs/ (dev/tooling.md first) documents version-specific behaviour: re-check it before bumping.
# postinstall deletes the discovery extensions (Appx, PowerShell modules): they cost about 3.3s per
# dsc process and find nothing winfiles uses. It runs only on install, so after changing this hook
# run `mise install --force github:PowerShell/DSC`. scripts/Invoke-Dsc.ps1 warns if they're back.
# A table of its own rather than an inline one, since TOML 1.0 keeps an inline table on one line
[tools."github:PowerShell/DSC"]
version = "3.3.0"
postinstall = "powershell -NoProfile -Command Remove-Item (Join-Path $env:MISE_TOOL_INSTALL_PATH *.dsc.extension.json)"
