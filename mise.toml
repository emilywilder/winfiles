# Tools for working in this repo, provided by mise (https://mise.jdx.dev) per directory
# instead of being installed system-wide. On a clean Windows 11 install:
#   winget install --id jdx.mise --exact --source winget --accept-package-agreements
#   (open a new terminal so mise is on PATH)
#   mise trust; mise install
#   mise exec -- just install
[tools]
just = "latest"
# DSC needs pwsh before dsc/powershell/pwsh.dsc.yaml installs it: scripts/Invoke-Dsc.ps1 runs
# under it, and PowerShellScript and the Winfiles/* resources are only discovered when
# tryWhich('pwsh') finds it
powershell = "latest"
# Elevates `just install`'s dsc config set in the same console, so its output and exit code stay there
gsudo = "latest"
# DSC v3, pinned because CLAUDE.md documents version-specific behaviour: re-check it before bumping.
# postinstall deletes the discovery extensions (Appx, PowerShell modules): they cost about 3.3s per
# dsc process and find nothing winfiles uses. It runs only on install, so after changing this hook
# run `mise install --force github:PowerShell/DSC`. scripts/Invoke-Dsc.ps1 warns if they're back.
"github:PowerShell/DSC" = { version = "3.3.0", postinstall = "powershell -NoProfile -Command Remove-Item (Join-Path $env:MISE_TOOL_INSTALL_PATH *.dsc.extension.json)" }
